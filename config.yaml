# ---------------------------------------------------------------------------
# jobscan config — merged version.
#
# Replaces the old title_keywords / title_blocklist / title_prefix_blocklist
# approach. Titles are no longer the filter; the model reads each posting and
# scores it. Only two hard gates remain: hard_exclude and location_allowlist.
#
# Company ATS slugs (greenhouse/lever/ashby) are gone — there is no public
# directory of board tokens, so maintaining them by hand wasn't worth it.
# Adzuna employer searches partially replace that coverage.
# ---------------------------------------------------------------------------

# Titles that never reach the scorer. This is the ONLY remaining hard gate on
# content, so it should stay short. Every entry here is a posting you will
# never see and never know you didn't see.
#
# The bar: could any description rescue this title? If yes, it does not belong
# here — let the scorer read it. "Software Engineer" is NOT here, because
# "Software Engineer, Economic Research Tools" deserves to be read.
# Titles never dropped by bridge.exclude, however the title is worded.
# Without this "Server Engineer" dies on the word "server" and "Customer
# Success Analyst" dies on "customer service". The scorer can say no out
# loud; a silent drop cannot be argued with.
professional_titles:
  - engineer
  - developer
  - scientist
  - analyst
  - architect
  - researcher
  - economist
  - statistician
  - counsel
  - strategist
  - consultant
  - fellow
  - "associate director"
  - "program manager"
  - "product manager"

hard_exclude:
  # Seniority genuinely out of reach for a May 2026 graduate
  - director
  - "vice president"
  - " vp "
  - chief
  - commissioner
  - deputy
  - "head of"
  - principal
  - senior
  - "sr "
  - "sr. "
  # Licensed professions
  - nurse
  - attorney
  - paralegal
  - physician
  - therapist
  # Licensed trades. "custodian" and "technician" USED to sit here; they moved
  # out when the bridge track opened, because "Lab Technician" and "Custodial
  # Worker, Night Shift" are exactly what that track is for. "driver" stays:
  # it is a CDL/own-vehicle gate more often than not. Delete the line if you
  # want to see delivery and shuttle work.
  - driver
  - electrician
  - plumber
  - welder
  - hvac
  # "Analyst" is a corporate suffix for a dozen jobs that share nothing with
  # research analysis. These are the ones a sweep of 16,000 boards drags in.
  - "revenue operations"
  - "revops"
  - "sales compensation"
  # "accounts payable", "accounts receivable", "payroll" and "quality control"
  # also moved out to the bridge track. They are back-office clerical work with
  # no public contact, which is the definition of what that track is looking
  # for. They will never appear in the career sections.
  - benefits
  - procurement
  - sourcing
  - "executive search"
  - recruiter
  - "grc analyst"
  - "security analyst"
  - "compliance analyst"
  - "aml analyst"
  - "fincrime"
  - "fraud risk"
  - "technical support"
  - "customer analyst"
  - "gtm operations"
  - "research software engineer"
  # "research engineer" and "member of technical staff" used to sit here.
  # They are the two most common titles at frontier AI labs - Research
  # Engineer is the standard non-PhD research track, and MTS is what most
  # labs call nearly everyone. Hard-excluding them meant never seeing them.
  # The seniority and credential gates now catch the ones genuinely out of
  # reach, so the scorer decides instead of a blocklist.
  - "crawling engineer"
  - biostatistician
  - postdoctoral
  - sourcer            # "Executive Talent Sourcer & Researcher" is recruiting
  - "k-9"

# Words that hint at relevance. NOT a filter — these only feed the keyword
# fallback used when the API is unreachable, so the cron job still produces
# something useful. Be generous; a false positive here costs nothing.
relevance_signals:
  - analyst
  - research
  - data
  - economist
  - economics
  - policy
  - quantitative
  - statistic
  - econometric
  - modeling
  - evaluation
  - scientist
  - "machine learning"
  - python
  - pandas
  - regression
  - survey
  - "public sector"

scoring:
  # HOW each track is scored. Which MODEL does it is the `ai:` block below.
  #
  #   jev      band + yes/no questions, read as probabilities per posting
  #            (jev.py). Any model: JevK5, a local model, or a hosted API.
  #   rubric   the prose rubrics under `rubrics:`, batches of postings per
  #            generative call (the original scorer). Any generative model.
  #   keyword  no model at all; relevance_signals only.
  #
  # `method` sets both tracks; override per track below. If jev fails (server
  # down, model missing) its postings fall back to the rubric, then keywords.
  # The old names still work: `provider:` for `method:`, and "anthropic"
  # for "rubric".
  method: jev
  # career:                      # per-track override
  #   scoring:
  #     method: rubric

  enabled: true
  batch_size: 20        # postings per rubric call (a model profile can
                        # override this; small local contexts need fewer)
  strong_at: 70         # >= this leads the email
  maybe_at: 45          # >= this gets a compact section; below is one-liners
  max_per_run: 600      # COST ceiling on postings sent to a model whose
                        # profile is cost: paid. Free (local) models are never
                        # capped. Excess is recorded UNSCORED and will not be
                        # re-scored next run, so keep this above your typical
                        # run size. ~600 Haiku rubric scores cost a few cents;
                        # jev on a hosted model makes 4 calls per posting.
  desc_chars: 700       # description characters sent per posting

# ---------------------------------------------------------------------------
# MODELS
#
# Every AI call in jobscan goes through llm.py and runs on one of the named
# profiles below. `ai:` says which profile does which job. Add as many
# profiles as you like; only the ones `ai:` names are ever called.
#
# provider   protocol + defaults. anthropic, openai, ollama, lmstudio,
#            llamacpp, vllm, openrouter, groq, together, deepseek, mistral,
#            gemini, xai, openai_compatible (any /v1/chat/completions server;
#            set base_url), jevk5, litellm (pip install litellm; Bedrock,
#            Vertex, Azure and the rest).
# model      the provider's model name.
# base_url   override the preset's endpoint (another port, a proxy, a LAN box).
# api_key_env  env var holding the key. Each hosted preset has a default
#            (OPENAI_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY, ...).
# cost       free | paid. ollama, lmstudio, llamacpp, vllm and jevk5 default
#            to free, which exempts them from scoring.max_per_run; everything
#            else is paid. Set `cost: free` on an openai_compatible server
#            that really is local, never on a proxy to a hosted API.
# concurrency  parallel jev postings. 1 for a single local GPU; 4-8 for
#            hosted APIs, within your rate limit.
# batch_size, desc_chars, max_tokens   rubric overrides for this model.
# temperature  sampling temperature for generation (omit = provider default).
# extra_body   merged into every request, e.g. to switch thinking off.
# server     how to start a local server if nothing is listening: either
#            exe + model_path (llama.cpp's llama-server) or command: [...].
#            A server jobscan starts is left running; one you started is
#            never touched.
#
# jev on a model other than JevK5 - `readout`:
#   auto        (default) logprobs if the endpoint returns them, otherwise
#               falls back to verbalized once and says so.
#   logprobs    softmax over the answer letters' log-probabilities. One call,
#               no text. llama.cpp, vLLM, Ollama and OpenAI's non-reasoning
#               models.
#   verbalized  the model writes its probabilities as JSON. Works on
#               anything, Anthropic included. Less calibrated.
#   vote        vote_samples answers at temperature 1, counted. N x the cost.
# calibration_temperature  >1 softens an overconfident model's probabilities.
#   Measure against --compare before trusting a new model's scores: the
#   thresholds under jev: were tuned on JevK5.
#
# `python preflight.py --probe` makes one tiny call to every model in use and
# reports what worked. `python llm.py` prints which profile each role uses.
# ---------------------------------------------------------------------------
models:
  # JevK5 on llama.cpp: the default for jev. Calibrated probabilities,
  # local, free. Started on demand from the server: block if not running.
  jevk5:
    provider: jevk5
    endpoint: "http://127.0.0.1:8090"
    # From the model's jevk5_config.json. A wrong value does not error, it
    # silently miscalibrates every probability. Check against your build.
    calibration_temperature: 1.22
    knockout_temperature: 0.93
    server:
      exe: "C:/Users/Kai/AI models/llama.cpp/llama-server.exe"
      model_path: "C:/Users/Kai/AI models/JevK5-4B-Q4/jevk5-4b-v0.3-Q4_K_M.gguf"
      ctx: 8192
      ngl: 99
      startup_timeout: 180

  haiku:
    provider: anthropic
    model: claude-haiku-4-5-20251001

  sonnet:
    provider: anthropic
    model: claude-sonnet-4-6

  opus:
    provider: anthropic
    model: claude-opus-5-5

  # ---- examples: uncomment, then name them under ai: ----------------------
  #
  # Ollama. `ollama pull qwen3:8b` first. jev reads logprobs through
  # Ollama's native API with thinking off; for the rubric and tailor, the
  # extra_body line turns Qwen3's thinking off on the OpenAI endpoint too
  # (drop it to let it think: slower, sometimes better). preflight --probe
  # shows which readout your Ollama version supports.
  # qwen-ollama:
  #   provider: ollama
  #   model: "qwen3:8b"
  #   extra_body: {reasoning_effort: none}
  #   batch_size: 4          # rubric: an 8k-32k context, not 200k
  #   desc_chars: 1200
  #
  # Any GGUF on llama.cpp's OpenAI endpoint. Supports logprobs.
  # local-gguf:
  #   provider: llamacpp
  #   base_url: "http://127.0.0.1:8091/v1"
  #   model: local
  #   extra_body: {chat_template_kwargs: {enable_thinking: false}}
  #   server:
  #     command: ["C:/Users/Kai/AI models/llama.cpp/llama-server.exe",
  #               "-m", "C:/Users/Kai/AI models/qwen3-8b-Q4_K_M.gguf",
  #               "-c", "16384", "-ngl", "99", "--port", "8091"]
  #   batch_size: 5
  #
  # LM Studio's local server.
  # lmstudio:
  #   provider: lmstudio
  #   model: "qwen3-8b"
  #
  # OpenAI. A non-reasoning model if you want logprobs for jev.
  # gpt-mini:
  #   provider: openai
  #   model: "gpt-4.1-mini"
  #   concurrency: 6
  #
  # OpenRouter: one key, most hosted models.
  # router:
  #   provider: openrouter
  #   model: "meta-llama/llama-3.3-70b-instruct"
  #
  # Gemini through Google's OpenAI-compatible endpoint.
  # gemini-flash:
  #   provider: gemini
  #   model: "gemini-2.5-flash"
  #
  # Anything else LiteLLM knows (pip install litellm).
  # bedrock-haiku:
  #   provider: litellm
  #   model: "bedrock/anthropic.claude-3-5-haiku-20241022-v1:0"

# Which profile does which job. Each entry is a profile name, an inline
# profile, or {career: ..., bridge: ...} to split by track.
#
# Override any of these for one run without editing this file:
#   JOBSCAN_AI="rubric=qwen-ollama,jev.career=gpt-mini" python main.py
#   python tailor.py 787428 --model qwen-ollama
ai:
  # jev defaults to the local JevK5 profile above even if this line is
  # removed; point it elsewhere only to try another model.
  jev: jevk5            # score.py, scoring.method: jev
  rubric: haiku         # score.py, scoring.method: rubric, and jev's fallback
  tailor: sonnet        # tailor.py; or split it:
  # tailor_analyze: haiku   # viability call, once per posting
  # tailor_letter: sonnet   # only for APPLY decisions
  # tailor_resume: sonnet

facts_file: resume.yaml

# ---------------------------------------------------------------------------
# BRIDGE TRACK
#
# A second track for work that pays rent while the career search runs. It is
# scored by a different rubric (score.BRIDGE_RUBRIC), against a different
# question: not "does this match the record" but "can he get it, and can he
# stand it". A degree is never a penalty there and never a qualification.
#
# The two tracks never mix in the digest. Bridge postings cannot push a
# research job out of the top section and cannot be confused for one.
#
# Track assignment is title-only and free (score.classify_track):
#   career title term hit           -> career, unchanged from before
#   bridge title term hit           -> bridge
#   bridge term + an `exclude` term -> dropped entirely, never scored
#   neither                         -> career (status quo)
# Career wins ties, so "Inventory Analyst" is still read as an analyst job.
# ---------------------------------------------------------------------------
bridge:
  enabled: true

  # Contact you will put up with, even though the words below would otherwise
  # drop it. `tolerated` beats `exclude` and is an include term in its own
  # right, so "Barista" reaches the scorer while "Barista/Server" no longer
  # has to be argued about: barista wins, and the rubric reads the duties.
  #
  # The rubric sorts contact into three kinds, and this list is about the
  # middle one: a queue and a task, over in forty seconds, nobody's mood
  # becomes your problem. Adjacent candidates if you want them, roughly in
  # order of how close they are to what is already here:
  #
  #   - counter, "counter attendant"     deli, bakery, kiosk
  #   - "circulation"                    library desk, extremely quiet
  #   - "pharmacy technician"            fill counter, but state licensure
  #   - cashier, "front end"             retail, which you said no to
  #   - "front desk", receptionist       transactional but you are the lobby
  #
  # Anything you add here still gets read and scored; it is not a promotion,
  # only permission for the model to consider it.
  tolerated:
    - barista
    - "coffee"
    - "cafe"
    - "café"
    - "espresso"
    - "roaster"

  # The actual no: relational service, phones, selling. Dropped before it
  # costs a model call. Only applied to titles that already matched a bridge
  # term, so "Server Engineer" and "Sales Operations Analyst" are unaffected
  # on the career track.
  exclude:
    # Retail floor
    - cashier
    - retail
    - "sales associate"
    - "sales floor"
    - "store associate"
    - "front end"
    - greeter
    - merchandiser
    - "brand ambassador"
    # Restaurant
    - server
    - waiter
    - waitress
    - barista
    - bartender
    - barback
    - busser
    - hostess
    - "line cook"
    - "prep cook"
    - dishwasher
    - "food service"
    - "food runner"
    - catering
    - "crew member"
    - "team member"
    # Phones and the public generally
    - "customer service"
    - "customer support"
    - "customer experience"
    - "call center"
    - "contact center"
    - "guest service"
    - "patient service"
    - "member service"
    - "front desk"
    - receptionist
    - concierge
    - teller
    - canvass
    - telemarket
    - "door to door"
    - "field interviewer"
    - "leasing consultant"

  # Never bridge work, even though the title contains a bridge word. Only
  # applied to titles that matched title_must_match, so it cannot remove
  # anything from the career track. Titles with a professional word
  # (engineer, consultant, counsel...) are not listed here: those are sent
  # to the career scorer instead of being dropped.
  never:
    - manager
    - supervisor
    - "account executive"
    - sales
    - strategy
    - strategic
    - "business development"
    - instructor
    - "information system"      # ISSO matched "security officer"
    - "data warehouse"

  # A bridge title must contain one of these. Generous on purpose: the rubric
  # reads the posting afterward and will say so when a title that sounds
  # back-of-house turns out to be a counter job.
  title_must_match:
    # Warehouse / logistics / production
    - warehouse
    - "material handler"
    - "materials handler"
    - inventory
    - stockroom
    - stocker
    - "stock associate"
    - picker
    - packer
    - "order selector"
    - "order picker"
    - fulfillment
    - "shipping and receiving"
    - "shipping clerk"
    - "receiving clerk"
    - "distribution center"
    - sortation
    - sorter
    - "production associate"
    - "production worker"
    - "machine operator"
    - "equipment operator"
    - "forklift"
    - assembler
    # Bare "packaging" and "manufacturing" pulled in Packaging Engineer,
    # Manufacturing Quality Engineer and Strategic Account Executive -
    # Manufacturing from the startup boards.
    - packager
    - "packaging associate"
    - "packaging operator"
    - "manufacturing associate"
    - "manufacturing technician"
    - "manufacturing operator"
    - "general labor"
    - laborer
    - "warehouse associate"
    # Clerical / records / back office
    - "data entry"
    - "data clerk"
    - "records clerk"
    - "file clerk"
    - "office clerk"
    - clerical
    - "office assistant"
    - "administrative assistant"
    - "administrative aide"
    - "clerk typist"
    - mailroom
    - "mail clerk"
    - "mail processor"
    - scanning
    - digitization
    - "document control"
    - "document specialist"
    - "document processor"
    - transcription
    - transcriber
    - "medical records"
    - "health information"
    - indexing
    - "claims processor"
    - "claims examiner"
    - "loan processor"
    - "accounts payable"
    - "accounts receivable"
    - payroll
    - bookkeep
    - "billing specialist"
    - "back office"
    - "back-office"
    - "data operations"
    # "operations associate" removed: on Greenhouse/Lever/Ashby it means
    # Strategy & Ops, Product Ops, Legal Ops, People Ops at $100K+, which
    # were about thirty of the rows in one digest. "Fulfillment Operations
    # Associate" still matches on "fulfillment". Put the line back if you
    # miss it.
    # - "operations associate"
    - "operations assistant"
    - "processing associate"
    - "processing specialist"
    # Lab / clinical support, no patient contact
    - "lab assistant"
    - "laboratory assistant"
    - "lab technician"
    - "laboratory technician"
    - "specimen"
    - "sterile processing"
    - histolog
    - "research technician"
    - vivarium
    # Facilities / grounds / overnight
    - custodial
    - custodian
    - janitorial
    - groundskeep
    - "building services"
    - "facilities assistant"
    - "maintenance worker"
    - "utility worker"
    - "night shift"
    - "overnight"
    - "third shift"
    - "security officer"
    - "security guard"
    - "surveillance"
    - "dispatcher"
    # Library / archive / collections
    - "library assistant"
    - "library page"
    - "archives assistant"
    - "collections assistant"
    # Inspection / QC
    - "quality control"
    - "quality assurance technician"
    - "quality inspector"
    - "qc inspector"
    # Animals and plants, in case it appeals
    - "animal care"
    - kennel
    - "greenhouse"
    - "plant care"

  # Reachable without a car: the NJ Transit Morristown Line from Dover in to
  # New York Penn, plus Springfield itself and the NYC boroughs off Penn.
  # Anything not on that list is a car commute, and the whole point of this
  # track is work you can actually get to at 6am.
  #
  # Every town is written with its state, in both the ", NJ" and ", New
  # Jersey" forms postings actually use. That is not redundancy: the previous
  # bare-town list matched Uniontown OH on "union", Elizabethtown KY on
  # "elizabeth", West Springfield MA on "springfield" and Fort Wayne IN on
  # "wayne". Madison, Chatham, Orange, Summit and Dover all exist in other
  # states too.
  #
  # A leading "^" anchors to the start of the location string. "new york"
  # unanchored matches "Webster, New York", which is upstate; "^new york"
  # matches only a posting whose location opens with the city.
  location_allowlist:
    # Home
    - "springfield, nj"
    - "springfield, new jersey"
    # Morristown Line, west end in to Summit
    - "dover, nj"
    - "dover, new jersey"
    - "denville, nj"
    - "denville, new jersey"
    - "mount tabor, nj"
    - "morris plains, nj"
    - "morris plains, new jersey"
    - "morristown, nj"
    - "morristown, new jersey"
    - "convent station, nj"
    - "madison, nj"
    - "madison, new jersey"
    - "chatham, nj"
    - "chatham, new jersey"
    - "summit, nj"
    - "summit, new jersey"
    # Summit in to Newark: the stretch you would actually commute
    - "short hills, nj"
    - "short hills, new jersey"
    - "millburn, nj"
    - "millburn, new jersey"
    - "maplewood, nj"
    - "maplewood, new jersey"
    - "south orange, nj"
    - "south orange, new jersey"
    - "orange, nj"
    - "orange, new jersey"
    - "east orange, nj"
    - "east orange, new jersey"
    - "newark, nj"
    - "newark, new jersey"
    # Transfers and the Hoboken branch
    - "secaucus, nj"
    - "secaucus, new jersey"
    - "hoboken, nj"
    - "hoboken, new jersey"
    - "jersey city, nj"
    - "jersey city, new jersey"
    - "harrison, nj"
    - "kearny, nj"
    # Union and Essex towns on the 114 bus rather than the train
    - "union, nj"
    - "union, new jersey"
    - "irvington, nj"
    - "hillside, nj"
    - "livingston, nj"
    - "livingston, new jersey"
    - "west orange, nj"
    - "west orange, new jersey"
    - "bloomfield, nj"
    - "montclair, nj"
    - "montclair, new jersey"
    # NYC, off Penn Station
    - "^new york"
    - "new york, ny"
    - "new york, new york"
    - "new york city"
    - "nyc"
    - "manhattan"
    - "brooklyn, ny"
    - "brooklyn, new york"
    - "queens, ny"
    - "queens, new york"
    - "bronx, ny"
    - "bronx, new york"
    - "long island city"
    - "staten island"
    # Remote data entry and transcription are real
    - "remote"

  # Scoring method for this track only (jev / rubric / keyword). Which
  # model runs it is ai.jev / ai.rubric, which can also differ per track.
  #   scoring:
  #     method: jev

  # Bridge thresholds are separate because the score means something else.
  # 70 on the career rubric is "apply to this". 70 here is "this would not
  # make you miserable and you could start next week".
  scoring:
    strong_at: 70
    maybe_at: 45

