# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

adzuna:
  country: us
  location: "New Jersey"
  max_days_old: 3
  results_per_page: 30

  # Broad role searches. One API call each, per run.
  queries:
    - "research analyst"
    - "data analyst economics"
    - "policy analyst"
    - "program evaluation"
    - "quantitative analyst"
    # Added with quota headroom at 836/1000. The ATS sweep was carrying all
    # the AI coverage on its own; Adzuna had no AI-adjacent query at all.
    - "machine learning research"

  # Employer-targeted exact-phrase searches. This is the partial replacement
  # for the ATS boards you dropped. Adzuna only finds these if one of the
  # boards it aggregates carried the posting, so treat a hit as a bonus and a
  # miss as expected — the run log tells you which came back empty.
  #
  # Wider date window than `queries` (see employer_max_days_old) and no
  # location filter, because a target employer hiring anywhere is worth seeing.
  employer_max_days_old: 14
  employers:
    - "Mathematica"
    - "Urban Institute"
    - "MDRC"
    - "Vera Institute of Justice"
    - "RAND Corporation"
    - "Abt Associates"
    - "Westat"
    - "NORC"
    - "Brookings Institution"
    - "Manhattan Institute"

  # Bridge-track searches. Separate from `queries` because they need a commute
  # radius, not a state: "New Jersey" returns Camden warehouse jobs. Adzuna
  # measures `bridge_distance` in kilometres from `bridge_where`; 40 is about
  # 25 miles, which covers Newark, Elizabeth, the Meadowlands, and Manhattan.
  #
  # The ATS sweep contributes almost nothing here (Greenhouse and Lever are
  # startup boards), so Adzuna is the main pipe for this track. Keep the list
  # short and rotate terms rather than adding ten more.
  bridge_where: "Springfield, New Jersey"
  bridge_distance: 40
  bridge_max_days_old: 7
  bridge_queries:
    - "warehouse associate"
    - "data entry clerk"
    - "office clerk"
    - "lab assistant"

  # Quota: (5 queries + 4 bridge + 10 employers) x 2 runs/day x 22 weekdays =
  # 836/month against a ~1,000 free tier. Four bridge terms is what fits. To
  # run more of them, delete one of the ten employers or drop jobscan.yml to a
  # single daily cron, which frees 418 calls.

usajobs:
  # Occupational series beat keyword search: they catch roles whose titles you
  # would never think to search for. Verify any code before adding it:
  #     python sources.py --series economist
  #     python sources.py --series statistic
  series:
    - "0110"    # Economist
    - "1560"    # Data Science
    # Uncomment after verifying with --series that these are what you expect:
    # - "1530"  # Statistician
    # - "1529"  # Mathematical Statistician
    # - "0343"  # Management and Program Analysis
    # - "1515"  # Operations Research

  # Keyword fallback for anything the series miss.
  keywords:
    - "research analyst"
    - "policy analyst"

  location: "New York, New York"
  results_per_page: 100
  max_pages: 3

  # Most federal announcements are open only to existing federal employees.
  # Leave this true unless you have federal status.
  public_only: true

  # Optional floor, e.g. 60000. Omit to see everything.
  # min_salary: 60000

nyc_open_data:
  enabled: true
  agencies: []
  limit: 500
  # Drop postings open only to current city employees.
  external_only: true

# ---------------------------------------------------------------------------
# Company job boards (Greenhouse / Lever / Ashby / Workday)
#
# These return FULL descriptions, unlike Adzuna's 500-char excerpts, so the
# scorer and the letter drafter both work much better on them.
#
# Slugs are not guessable and there is no official directory. Get them with:
#     python slugs.py --refresh
#     python slugs.py --find "Urban Institute" "RAND Corporation" "Vera Institute"
# That downloads a Common-Crawl-derived list, probes each candidate against the
# live API, and prints a verified block to paste here.
#
# Cost: one request per board per run. Keep this to employers you would
# actually apply to — 20-40 is comfortable, 300 is not.
# ---------------------------------------------------------------------------
# Company job boards (Greenhouse / Lever / Ashby / Workday)
#
# These return FULL descriptions, unlike Adzuna's 500-char excerpts.
#
# The sweep checks EVERY board in the public slug directory — about 15,900 of
# them — and keeps jobs by TITLE and LOCATION, not by employer. Curating a
# list of favourite companies throws away almost everything and is fragile
# besides (a live board does not prove it is the company you meant).
#
# Before the first run:   python slugs.py --refresh
# ---------------------------------------------------------------------------
ats:
  sweep:
    enabled: true
    platforms: [greenhouse, lever, ashby]

    # Concurrent requests. 24 does ~16,000 boards in about five minutes.
    # Lower it if you get connection errors.
    workers: 24

    # A title must contain one of these to survive. Defaults to
    # relevance_signals above if omitted. This is the main dial: loosen it to
    # see more, tighten it to cut noise.
    title_must_match:
      - analyst
      - research
      - economist
      - economics
      - policy
      - quantitative
      - econometric
      - statistician
      - "data scientist"
      - "data science"
      - evaluation
      - "program evaluat"
      - statistic          # catches "Statistical Analysis", "Statistician"
      - "quantitative"
      # ML / AI research. "research", "scientist" and "analyst" already catch
      # a lot (Scale AI's ML Research Scientist, Cartesia's Researcher), but
      # these titles contain none of those words.
      - "machine learning"
      - "ml engineer"
      - "applied scientist"
      - "deep learning"
      - "ai resident"
      - "research resident"
      - "nlp"
      # AI ethics, safety and governance. "safety" alone is not usable: it
      # matches Safety Officer and food-safety jobs, which is why each term
      # here is qualified.
      - "ai safety"
      - "ai ethics"
      - "ai governance"
      - "responsible ai"
      - "ai policy"
      - "model safety"
      - "safety researcher"
      - "alignment"
      - "fairness"
      - "sociotechnical"
      - "red team"
      - "model behavior"
      - "model behaviour"
      - "trust and safety"
      - "trust & safety"
      # Science and research communication.
      - "science writer"
      - "science communication"
      - "science communicator"
      - "research communication"
      - "scientific communication"
      - "knowledge translation"
      - "dissemination"
      - "public engagement"
      - "science journalist"
      - "data journalist"
      - "member of technical staff"

    # After the first full sweep, boards that have produced a match are always
    # checked and the rest rotate at this fraction per run, so a routine run
    # is far cheaper than the first one.
    cold_share: 0.25
    # Force a complete sweep regardless of history.
    full_sweep: false

    # Greenhouse omits descriptions from its list call, so each surviving job
    # costs one more request. This caps that.
    max_details: 2500

  # Workday can't be swept cheaply (POST, 20/page, no description in the list),
  # so it stays curated. Slugs are "tenant|datacenter|site".
  workday:
    - "rb|wd5|FRS"                                    # Federal Reserve System, all 12 banks
    - "rand|wd5|external_career_site"                 # RAND Corporation
    - "cornerstone|wd501|cornerstoneresearch_careers" # Cornerstone Research
  workday_search: "analyst"
  workday_max_pages: 3
  workday_max_details: 25

# ---------------------------------------------------------------------------
# jev: the questions the band scorer asks (see scoring.method)
#
# jev.py asks each posting one ordered-band question plus three yes/no checks
# and composes them with pay and shift pulled out by regex. The model that
# answers is ai.jev below; JevK5 gives calibrated probabilities directly,
# other models are read through their logprobs or asked for probabilities
# (see `readout` under models:).
#
# The llama.cpp settings that used to live here (endpoint, temperature,
# server_exe, model_path, ctx, ngl) are now the `jevk5` profile under
# models:. Old keys left here are still read if that profile is absent.
# ---------------------------------------------------------------------------
jev:
  # ------------------------------------------------------------------------
  # EVERY JUDGMENT THE LOCAL SCORER MAKES IS BELOW, LIVE, NOT COMMENTED.
  #
  # jev.py carries the same values as a fallback for any key you delete, but
  # what is here is what runs. It used to be the other way round - the real
  # bands lived in Python and this block was a stale comment describing five
  # career bands when the code shipped seven.
  #
  # The band ORDER is the preference. Bands run lowest (worst) to highest
  # (best); move a line and you have changed what the digest ranks first.
  # Any number of bands works as long as `labels` matches 1:1.
  #
  # Keep each band SINGLE-CLAUSE. Two earlier versions failed on this: a
  # five-condition bridge band ("no public contact AND hires immediately AND
  # commutable AND pay stated AND liveable") was unreachable because most
  # postings omit pay, and a career band that listed domains ("...in social
  # policy, economics, criminal justice, government") let a municipal
  # caseworker match on the domain alone and score 99.
  #
  # Ask the yes/no questions only about what is IN THE POSTING TEXT. A
  # version that asked "does this look legitimate" needed a wage table the
  # model does not have, so it guessed: a $70,600 remote data-entry posting
  # came back 0.92 legitimate and ranked first. Asking about the onboarding
  # fee it actually mentions returns 0.96.
  #
  # `python preflight.py` validates this block. A broken one falls back to
  # the jev.py defaults with a warning, so a typo costs accuracy for one run
  # rather than the run itself.
  # ------------------------------------------------------------------------

  contact:
    instructions: >-
      Read the duties and decide how much contact with customers, clients, patients
      or the general public this job actually involves. Judge the described work,
      not the job title. Ignore pay, location, schedule and required experience
      entirely.
    bands:
    - >-
      Selling to people is the job: cold calling, door-to-door, a commissioned
      sales floor, or a quota attached to the worker's name.
    - >-
      The worker owns someone's experience for an extended stretch and is the
      person they complain to: waiting tables with a section, a support or ticket
      queue, a front desk, or a named satisfaction metric.
    - >-
      The worker deals with the public in short, repeated, scripted exchanges
      that end quickly: a counter, a service window, a pickup desk. Nobody's ongoing
      experience is the worker's responsibility.
    - >-
      The worker occasionally encounters someone from outside the organisation,
      but it is incidental and not what the job is for.
    - >-
      The worker deals only with coworkers. A whole shift can pass without speaking
      to a customer at all.
    labels:
    - commissioned sales
    - relational service
    - transactional counter
    - incidental contact
    - no public contact
  gate:
    instructions: >-
      Does this posting require something a first-time applicant would not already
      have — more than about two years of specific prior experience, a professional
      licence, a certification, a security clearance, or a commercial driving
      licence?
    'true': >-
      Yes, there is a stated requirement that would screen out a candidate with
      no experience in this field.
    'false': >-
      No, the posting is open to someone without prior experience in this line
      of work, or any preference stated is soft.
  fee:
    instructions: >-
      Does this posting ask the applicant to pay a fee, buy or pay for equipment
      or training, provide bank account or card details, or send money at any
      stage of hiring or onboarding?
    'true': >-
      Yes, the applicant is asked for money, payment details, or to cover a cost
      before or during onboarding.
    'false': No, the employer pays the worker and asks for nothing financial from
      the applicant.
  career_fit:
    instructions: >-
      Read the duties and decide what kind of work this job actually is. Judge
      the described work, not the job title, and not the employer. Ignore seniority,
      required years and start dates - those are asked separately.
    bands:
    - >-
      A different profession: sales, recruiting, teaching, nursing, trades, retail,
      or software engineering with no analysis.
    - >-
      Casework, coordination or administration: processing applications, interviewing
      clients or claimants, scheduling, representing an agency to the public,
      or running a programme day to day.
    - >-
      Business reporting: building dashboards, maintaining spreadsheets, and pulling
      metrics for other teams.
    - >-
      Explaining research to people outside it: science writing, research communication,
      policy briefs, data journalism, dissemination, or public engagement about
      technical findings.
    - >-
      Studying the social or ethical effects of technology: AI ethics, fairness,
      algorithmic accountability, responsible AI, AI governance or technology
      policy.
    - >-
      Applied quantitative work: forecasting, experimentation, A/B testing, data
      science or machine learning on operational data.
    - >-
      Original research that produces findings: econometrics, survey or administrative
      microdata analysis, program evaluation, or machine learning and AI research.
    labels:
    - different profession
    - casework or coordination
    - reporting, not research
    - research communication
    - AI ethics or governance
    - applied quantitative
    - research
  # Voice questions jev asks of each PARAGRAPH of a draft. A regex settles
  # the mechanical rules; these are the judgments it cannot make. Override
  # or add here and jev.py merges them over its defaults; voice_threshold
  # is how sure it must be before the paragraph is flagged.
  voice_threshold: 0.72
  # How sure jev must be before a flagged paragraph is worth a paid
  # rewrite. Between the two thresholds a finding is reported and left
  # to you: a probability is an opinion, and an opinion should not
  # silently spend money.
  voice_revise_at: 0.85
  career_level:
    # The old wording asked only how MANY years a posting named, so a line
    # like "4 years of relevant experience including graduate research,
    # internships, and applied professional experience" read as senior. That
    # posting is in fact open to this candidate: it says so in the same
    # sentence. What matters is not the number, it is whether the posting's
    # own definition of experience admits research assistantships,
    # internships and fellowships. Both bands stay single-clause on that one
    # axis; the lists inside them are alternatives, not conditions to meet
    # together.
    instructions: >-
      Counting experience the way THIS posting says to count it, is the role
      open to someone who finished a bachelor's degree recently and whose
      background is research assistantships, internships and fellowships
      rather than years of full-time salaried work?
    'true': >-
      Yes. It is entry-level or early-career, states no minimum, or counts
      internships, graduate research, assistantships or academic work toward
      the experience it asks for, whatever number of years it names.
    'false': >-
      No. It is senior, lead, principal or managerial, or it asks for years
      of full-time professional employment that internships and academic
      research would not satisfy.
  career_gate:
    instructions: >-
      Does this posting require a credential beyond a bachelor's degree - a master's,
      PhD, law degree, professional licence, security clearance - or require the
      applicant to be CURRENTLY ENROLLED as a student, which a 2026 graduate is
      not?
    'true': >-
      Yes. A graduate degree, licence, clearance, or current student enrolment
      is required. Internships, externships, co-ops and campus programmes count
      as requiring enrolment.
    'false': No, a bachelor's degree or equivalent experience is sufficient.
  temporal:
    instructions: Today is {today}. Can someone apply to this job NOW and start
      within the next few months?
    'true': Yes, it is open for applications now and the work starts soon or immediately.
    'false': >-
      No. The application deadline has passed, the role is for a future term or
      season more than a few months away, the posting is for a programme that
      has already started, or it names a year later than the current one.
  min_desc_chars: 120
  profile_chars: 1200
  # ------------------------------------------------------------------
  # resume mode (fit.py). The model is shown your record above each
  # posting and the score is the PRODUCT of its answers:
  #   career  match x P(credentials) x P(experience) x P(open now)
  #   bridge  contact x P(can get it) x P(no fee) x P(open now)
  # No caps or penalties: `thresholds:` below is only used by
  # mode: bands, the previous scorer. Edit the wording here; the
  # band ORDER in career_match is lowest to highest.
  #   python fit.py --candidate   the text the model reads about you
  #   python fit.py --check       every factor, plus a control posting
  # ------------------------------------------------------------------
  mode: resume          # resume | bands
  # Characters of each posting jev reads (was scoring.desc_chars, 700).
  desc_chars: 2000
  # Write your own summary here to replace the one generated from
  # resume.yaml:
  # candidate: >-
  #   CANDIDATE RECORD. B.A. in Economics ...
  fit:
    career_match:
      instructions: Compare the duties this job posting describes with the work in
        the candidate record above it. Judge the duties, not the job title or the
        employer. Ignore degree requirements, years of experience and dates entirely;
        those are asked separately.
      bands:
      - The duties are a different occupation from anything in the candidate record.
      - 'The duties are adjacent to the record: related subject matter, but not work
        the candidate has done.'
      - Some of the central duties are things the candidate has done; the rest would
        be new.
      - Most of the central duties are things the candidate has done.
      - The central duties are the work the candidate record describes.
      labels:
      - different occupation
      - adjacent work
      - partial match
      - mostly matches
      - direct match
    needs_graduate_degree:
      instructions: Does this posting REQUIRE a master's degree, PhD or other graduate
        degree?
      'true': Yes. A graduate degree is stated as required.
      'false': No. A bachelor's degree is enough, or a graduate degree is only preferred.
    needs_enrolment:
      instructions: Does this posting require the applicant to be CURRENTLY enrolled
        as a student?
      'true': 'Yes. It is for current students: an internship, co-op or programme
        that requires active enrolment.'
      'false': No. Graduates can apply.
    has_credentials:
      instructions: Leaving degree level aside, does the candidate record show the
        field of study, licence, certification, security clearance or language this
        posting requires?
      'true': Yes. The record shows what the posting requires, or the posting requires
        none of these.
      'false': No. It requires a degree in a different field, or a licence, certification,
        clearance or language the record does not show.
    has_experience:
      instructions: Does the candidate record show the experience this posting REQUIRES,
        counting experience the way this posting says to count it?
      'true': Yes. The role is entry-level or states no minimum, or the amount and
        kind of experience it asks for is covered by the record, including assistantships
        and internships where the posting counts them.
      'false': No. It asks for more years than the record shows, a senior, lead or
        people-management level, or hands-on experience in a field or tool the record
        does not contain.
    career_features:
    - career_match
    - needs_graduate_degree
    - needs_enrolment
    - has_credentials
    - has_experience
    - open_now
    barrier_features:
    - needs_graduate_degree
    - needs_enrolment
    can_get:
      instructions: Could the candidate in the record above be hired for this job
        as the record stands?
      'true': 'Yes. The posting asks for nothing the record lacks: no licence, certification,
        clearance or language, and no years of experience in this specific line of
        work. A degree the job does not need is not a barrier.'
      'false': 'No. The posting requires at least one thing the record does not show:
        a licence, certification, clearance, language, or prior experience in this
        specific line of work.'
    candidate_chars: 2600
    requirement_chars: 600
    weights_file: fit_weights.yaml
    tracker: 'https://docs.google.com/spreadsheets/d/1lvbdZbaF21yZkuJxlepqxgsLOvDz9apAnC61mwpcCFQ/edit?gid=861095313'
    tracker_tab: Job Search
    service_account_file: 'C:/Users/Kai/job search/savvy-girder-515321-c6-805a23be0c6f.json'
    refit: on_run
    negatives_per_positive: 4
    regularization:
    - 0.1
    - 1.0
    - 10.0
    review_band: 0.15
    review_min_score: 45
  thresholds:
    gate_hard: 0.65
    gate_hard_cap: 40
    gate_soft: 0.45
    gate_soft_penalty: 10
    fee: 0.5
    fee_cap: 10
    implausible_hourly: 30.0
    implausible_gate_below: 0.25
    implausible_cap: 25
    review_top_band: 0.55
    review_gate_lo: 0.35
    review_gate_hi: 0.65
    review_fee_lo: 0.3
    review_fee_hi: 0.5
    hours_per_year: 2080
    career_level_below: 0.35
    career_level_cap: 30
    career_level_soft: 0.6
    career_level_penalty: 10
    career_gate_above: 0.65
    career_gate_cap: 25
    career_review_top_band: 0.5
    temporal_open_below: 0.35
    temporal_soft: 0.6
    temporal_penalty: 15
    no_desc_score: 45

# ---------------------------------------------------------------------------
# RUBRICS
#
# The prose the rubric scorer is given, one per track, on whatever model
# ai.rubric names. Used when a track's scoring.method is "rubric", and as
# jev's fallback. score.py carries the same text if you delete a key.
#
# {today} is replaced with the current date at request time.
#
# These are the originals, moved here unchanged so that every job-search
# specification lives in one file rather than half here and half in Python.
# ---------------------------------------------------------------------------

rubrics:
  "career": |-
    You are triaging job postings for one specific candidate. Score
    each posting 0-100 on how good a fit it is FOR THIS CANDIDATE. You are not
    judging whether the job is good, prestigious, or well paid. Only fit.

    IMPORTANT: this candidate is broader than a quantitative analyst. Do not make
    "analyticalness" a hidden requirement. A communications, policy, program,
    research-coordination, client-support, data-operations, or stakeholder-facing
    role can be a strong fit when its actual duties match the candidate record.
    Score the overlap that exists; do not penalize a job merely for belonging to a
    different function than economics/data analysis.

    ANCHORS — use the full range. A run where everything lands 50-70 is useless.
      85-100  Squarely in scope. Candidate meets the stated requirements.
      70-84   Strong match. Most core duties are supported; gaps are minor/learnable.
      45-69   Plausible. Real gaps, OR not enough posting text to judge confidently.
      20-44   Stretch. Wrong level, or the central duties are only weakly adjacent.
       0-19   Wrong function/level, or a visible structural eligibility barrier.

    WEIGHTING, in order:
      1. STRUCTURAL ELIGIBILITY + LEVEL. This candidate graduated in May 2026,
         which is in the PAST as of {today}. Treat them as a graduate holding the
         degree, not a student. A hard 5+ year floor, required graduate degree,
         required license, or people-management role can dominate the score.
      2. ACTUAL DUTIES. Compare the posting duty-by-duty against the entire factual
         record. Several direct duty matches can justify 70+ even when the title or
         function is not primarily analytical.
      3. TRANSFERABLE CAPABILITY CLUSTERS. Give full credit when the job draws on
         any substantial cluster documented in the record, including:
           - data/quant: Python, statistics, econometrics, Excel, data cleaning, QA,
             visualization, automation, large datasets;
           - policy/research: economics, public policy, labor policy, legal/regulatory
             research, literature review, source verification, policy writing;
           - communications/stakeholders: presentations, translating technical or
             policy material, earned-media/partnership work, liaison work, public
             speaking, cross-functional and external-stakeholder coordination;
           - program/project/operations: project delivery, evaluation design,
             documentation, records, process improvement, sensitive-data handling.
      4. DOMAIN + NAMED TOOLS. Domain familiarity helps but is not mandatory when
         duties transfer. Missing one named tool is normally a gap, not a verdict.

    DO NOT down-score merely because:
      - the job is communications, policy, program, operations, client support,
        research coordination, or another non-quantitative function;
      - the title contains engineer/developer/scientist; read the actual duties;
      - one named tool is missing. SQL, R, Stata, Tableau, Databricks, Salesforce,
        etc. are gaps only to the degree the posting makes them central;
      - the candidate's closest evidence comes from an adjacent domain.

    DO down-score hard for:
      - security clearance required and not realistically obtainable at entry level;
      - a professional license or graduate degree explicitly stated as required;
      - management of people as a core duty;
      - a hard experience minimum missed by years.

    TEMPORAL ELIGIBILITY IS A HARD GATE. Today is {today}. If a posting states
    an internship, fellowship, cohort, program, fixed-term assignment, or job
    period whose START DATE has already passed, score it 0 even if the employer
    left the posting online. If an explicit application deadline has passed, also
    score it 0. A deterministic pre-filter should catch these first; this rule is
    redundant protection. Do not confuse the posting publication date with the
    employment/program start date.

    Do NOT invent requirements from a title. For example, a title such as "Policy
    Counsel" may ultimately require a JD/bar admission, but if an incomplete
    posting does not actually state that, flag it for manual review rather than
    assuming the requirement.

    MISSING TOOLS. Distinguish a tool gap from a function gap. An early-career
    role can still be a strong overall fit when most duties match and one required
    tool is learnable. Conversely, if advanced use of that tool is the central daily
    duty, keep the score below the strongest range and say why.

    INCOMPLETE POSTINGS. Some entries are marked [EXCERPT ONLY] or [TITLE ONLY].
    You are judging a fragment, not the posting. Absence of evidence in a truncated
    excerpt is NOT evidence of a bad fit. If the visible title/text supports a
    plausible or strong match but the excerpt does not contain enough duties, level,
    or qualifications to make a confident decision, set "review": true. For such
    entries:
      - do not score below 45 solely because information is missing;
      - score the evidence that IS visible, without inventing missing requirements;
      - begin the reason with "manual review:" and state what makes it promising
        and what must be checked in the full posting.
    A visible disqualifier still scores low normally and should use review=false.

    FULL POSTINGS can also use review=true when the text itself is genuinely
    ambiguous or internally incomplete, but do not use manual review as a hedge for
    every borderline score.

    Return ONLY a JSON array, no fences, no preamble. One object per posting:
      {"i": <index>, "score": <0-100>, "review": <true|false>,
       "reason": "<max 20 words>"}

    The reason must be concrete and specific to THIS posting. Name the actual
    match or actual gap. Never say the candidate "lacks communications, labor,
    policy, stakeholder, or project experience" if the candidate record contains
    adjacent evidence in those areas. When you score something low, the reason is
    the only thing the candidate will see, so make it the sentence that lets them
    decide you were wrong.
  "bridge": |-
    You are triaging job postings for one specific person. These
    postings are on the BRIDGE track: work that pays the bills while a separate
    search for research, policy, and quantitative roles runs in parallel. The
    candidate record is attached, but you are NOT scoring against it the way you
    would for a career role.

    THE QUESTION HERE IS DIFFERENT. Score 0-100 on two things only:

      1. CAN HE GET IT? Entry-level, hires off the street, no license or
         certification that takes months, no years of specific experience, no
         clearance, no CDL, no car assumed unless the location is transit-reachable.
      2. CAN HE STAND IT? The binding constraint is PUBLIC CONTACT, and it is not
         a yes/no question. What matters is how long one interaction lasts and
         whether he absorbs the other person's dissatisfaction. Sort every posting
         into one of three kinds:

           NONE. Warehouse, overnight stocking, records, lab support, mailroom,
           back-office processing. He may go a shift without speaking to anyone
           who does not work there. This is what he is looking for.

           TRANSACTIONAL. There is a queue and a task. The interaction is short,
           repeatable, and ends. A barista pulling shots, a mailroom window, a
           library circulation desk, a pharmacy fill counter. He has said this is
           acceptable. Do NOT score it as though it were the next kind.

           RELATIONAL. He owns someone's experience for an extended stretch and is
           the person they complain to. A waiter with a section, a retail floor
           associate on commission, a call-center queue, anything tipped, anything
           with a satisfaction score attached to his name. This is the actual no.

         The line runs between a barista and a waiter, not between indoors and
         outdoors. Read the duties and decide which kind the job really is; a
         title of "Cafe Associate" can be either.

    A four-year degree and a research background are NEITHER a qualification NOR a
    disqualification here. Never score a posting down as "overqualified" and never
    score it up because it mentions data or analysis. Do not write reasons about
    career fit, growth, or whether the job is beneath him. He knows.

    ANCHORS — use the full range.
      85-100  No public contact, hires immediately, commutable, pay stated and
              liveable. Warehouse, overnight stocking, data entry, records, lab
              support, mailroom, back-office processing.
      70-84   Incidental contact only (a dock, a service window, covering a desk
              at lunch), or transactional counter work that is otherwise clean:
              steady hours, stated pay, no tips, no quota. A well-paid barista job
              at a stable employer belongs here, not below.
      45-69   Real friction: transactional contact plus something else bad, a
              physical demand worth naming, an erratic or on-call schedule,
              unstated pay, a short certification, or a location needing a car.
      20-44   Relational service work. He has not ruled this out absolutely, but
              he would be unhappy: tipped floor service, a section of tables, a
              commissioned sales floor, a named satisfaction metric.
       0-19   Cold sales, door-to-door, a call-center queue, or a hard gate (CDL,
              active clearance, licensure, 3+ years required).

    READ THE POSTING, NOT THE TITLE. Titles lie in both directions on this track.
    "Operations Associate" is frequently a call center. "Service Coordinator" may
    be pure data entry. "Inventory Specialist" at a boutique is a sales floor job
    with a stockroom attached. "Cafe Associate" is transactional at a kiosk and
    relational at a sit-down place with tables. When the duties reveal a worse
    kind of contact than the title implied, score it down and say where you saw
    it. When they reveal a better kind, score it up the same way.

    WHAT TO PUT IN THE REASON. The reason is the only thing he reads before
    deciding, and for this track the useful facts are:
      - the pay, verbatim, if the posting states one ("$19.50/hr", "$44k-$52k");
      - the shift, if it is not standard business hours ("11p-7a", "weekends");
      - which of the three contact kinds it is, in plain words, and what in the
        posting told you ("counter queue, no tips" / "own section, tipped");
      - any hard barrier.
    Lead with pay and shift when both are visible. Skip anything you had to guess.

    PHYSICAL WORK IS FINE, say so plainly rather than treating it as a defect. A
    50lb lifting requirement, standing for eight hours, or a cold warehouse is
    information, not a penalty. Score it as a 45-69 only when the posting describes
    something genuinely punishing, and name what it is.

    TEMPORAL ELIGIBILITY IS STILL A HARD GATE. Today is {today}. A stated start
    date or application deadline in the past scores 0. Seasonal work whose season
    has passed scores 0.

    INCOMPLETE POSTINGS marked [EXCERPT ONLY] or [TITLE ONLY]: do not invent duties
    or pay. If the visible text suggests a workable fit but you cannot see the
    public-contact level or the pay, set "review": true, do not score below 45 for
    missing information alone, and begin the reason with "manual review:".

    Return ONLY a JSON array, no fences, no preamble. One object per posting:
      {"i": <index>, "score": <0-100>, "review": <true|false>,
       "reason": "<max 20 words>"}
