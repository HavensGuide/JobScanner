<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobscan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------
   Tokens. Cool index-card greys, one cobalt for anything you can press,
   and tier colours that mean the same thing on every page.
   --------------------------------------------------------------------- */
:root {
  --bg: #E6EBEF;
  --surface: #F6F8FA;
  --raised: #FFFFFF;
  --ink: #17232B;
  --muted: #566571;
  --faint: #8794A0;
  --line: #CCD5DC;
  --line-soft: #DDE3E8;
  --accent: #2747C9;
  --accent-soft: #E3E8FA;
  --on-accent: #FFFFFF;
  --strong: #17784C;
  --review: #6A43AD;
  --maybe: #A06A00;
  --weak: #74818B;
  --unscored: #3D7AA6;
  --danger: #B3261E;
  --ok: #17784C;
  --log-bg: #17232B;
  --log-ink: #D8E2E9;

  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;

  --r-small: 4px;
  --r: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181D; --surface: #172028; --raised: #1D2730;
    --ink: #E2E8ED; --muted: #9AA8B4; --faint: #6F7D89;
    --line: #2B3843; --line-soft: #232F38;
    --accent: #8098FF; --accent-soft: #232D52; --on-accent: #0E1430;
    --strong: #52C08B; --review: #A98BE6; --maybe: #D9A63D;
    --weak: #8693A0; --unscored: #6FAED8; --danger: #F2867E; --ok: #52C08B;
    --log-bg: #0C1115; --log-ink: #CFD9E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181D; --surface: #172028; --raised: #1D2730;
  --ink: #E2E8ED; --muted: #9AA8B4; --faint: #6F7D89;
  --line: #2B3843; --line-soft: #232F38;
  --accent: #8098FF; --accent-soft: #232D52; --on-accent: #0E1430;
  --strong: #52C08B; --review: #A98BE6; --maybe: #D9A63D;
  --weak: #8693A0; --unscored: #6FAED8; --danger: #F2867E; --ok: #52C08B;
  --log-bg: #0C1115; --log-ink: #CFD9E0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--sans);
  font-feature-settings: "tnum" 0;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.hidden { display: none !important; }

/* ---------------------------------------------------------------------
   Frame: sidebar + page
   --------------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 212px 1fr; height: 100%; }
.side {
  border-right: 1px solid var(--line); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 22px; background: var(--bg);
  overflow-y: auto;
}
.mark {
  font: italic 400 27px/1 var(--serif); letter-spacing: -0.01em;
  padding: 0 8px; margin: 0;
}
.mark small {
  display: block; font: 500 12px/1.3 var(--sans); font-style: normal;
  color: var(--muted); margin-top: 6px; letter-spacing: 0;
}
nav { display: flex; flex-direction: column; gap: 1px; }
nav a {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: var(--r-small);
  color: var(--ink); text-decoration: none; font-weight: 500;
}
nav a:hover { background: var(--line-soft); }
nav a[aria-current="page"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
nav a .count { color: var(--muted); font-weight: 400; font-size: 13px; }
.side-foot { margin-top: auto; font-size: 13px; color: var(--muted); padding: 0 8px; }
.side-foot p { margin: 0 0 8px; }
.tasks-mini a { color: var(--ink); text-decoration: none; display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.spin {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  border: 2px solid var(--accent); border-right-color: transparent;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-right-color: var(--accent); opacity: .6; } }

main { overflow-y: auto; min-width: 0; }
.page { padding: 22px 28px 40px; max-width: 1480px; }
.page-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font: 600 24px/1.2 var(--sans); letter-spacing: -0.015em; margin: 0; }
h2 { font: 600 17px/1.3 var(--sans); margin: 0 0 4px; }
h3 { font: 600 15px/1.3 var(--sans); margin: 0 0 6px; }
.lede { color: var(--muted); margin: 2px 0 14px; max-width: 70ch; }

/* ---------------------------------------------------------------------
   Controls
   --------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--raised);
  padding: 6px 12px; border-radius: var(--r-small); cursor: pointer;
  font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn.quiet:hover { background: var(--accent-soft); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-small); background: var(--raised); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--raised); }
input[type=text], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-small);
  padding: 6px 9px; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
label.field > input, label.field > select, label.field > textarea { color: var(--ink); font-weight: 400; font-size: 15px; }
label.check { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); max-width: 72ch; }

/* tier language */
.t-strong { color: var(--strong); } .t-review { color: var(--review); }
.t-maybe { color: var(--maybe); } .t-weak { color: var(--weak); } .t-unscored { color: var(--unscored); }
.tierword { font-weight: 600; }

/* ---------------------------------------------------------------------
   Postings: the score strip is the one loud thing in the product
   --------------------------------------------------------------------- */
.strip-wrap { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px 12px; margin-bottom: 14px; }
.strip-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.strip-top .zones { display: flex; gap: 18px; font-size: 14px; flex-wrap: wrap; }
.strip-top .zones b { font-variant-numeric: tabular-nums; }
.strip { position: relative; height: 92px; user-select: none; touch-action: none; }
.strip svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.handle {
  position: absolute; top: -4px; bottom: 16px; width: 22px; margin-left: -11px;
  cursor: ew-resize; display: flex; justify-content: center; z-index: 2;
}
.handle::before { content: ""; width: 2px; background: var(--ink); border-radius: 1px; }
.handle span {
  position: absolute; top: -2px; left: 13px; white-space: nowrap;
  font: 600 12.5px/1 var(--sans); background: var(--ink); color: var(--raised);
  padding: 4px 6px; border-radius: 3px; font-variant-numeric: tabular-nums;
}
.handle.maybe span { left: auto; right: 13px; }
.handle:focus-visible { outline: none; }
.handle:focus-visible::before { width: 4px; background: var(--accent); }
.strip-axis { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; font-size: 11.5px; color: var(--faint); }
.strip-axis span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.strip-actions { display: flex; gap: 8px; align-items: center; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--line); background: var(--raised); border-radius: 999px;
  padding: 3px 11px 3px 10px; cursor: pointer; font-weight: 500; font-size: 14px;
  display: inline-flex; gap: 6px; align-items: baseline;
}
.chip .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
.filters .grow { flex: 1 1 200px; min-width: 160px; }

.split { display: grid; grid-template-columns: minmax(330px, 42%) 1fr; gap: 14px; align-items: start; }
.list { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list-head { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13px; color: var(--muted); }
.jobrow {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 10px;
  padding: 10px 14px 10px 12px; border-bottom: 1px solid var(--line-soft);
  cursor: pointer; text-align: left; width: 100%; border-left: 3px solid transparent;
  background: none; border-top: 0; border-right: 0;
}
.jobrow:hover { background: var(--surface); }
.jobrow[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.jobrow .sc { grid-row: span 2; font: 600 21px/1.1 var(--sans); font-variant-numeric: tabular-nums; padding-top: 1px; }
.jobrow .ti { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobrow .co { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobrow .side-r { grid-row: span 2; text-align: right; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.jobrow.dim .ti, .jobrow.dim .co { opacity: .55; }
.pill { font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; line-height: 18px; }
.pill.applied { color: var(--strong); border-color: currentColor; }
.pill.saved { color: var(--accent); border-color: currentColor; }
.pill.drafted { color: var(--review); border-color: currentColor; }
.pill.reviewed { color: var(--maybe, #9a6700); border-color: currentColor; }
.pill.skipped { color: var(--muted); border-style: dashed; }
.check .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.more { padding: 12px; text-align: center; }

.detail { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 26px 30px; position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; }
.detail .empty { color: var(--muted); padding: 40px 0; text-align: center; }
.d-title { font: 500 27px/1.18 var(--serif); letter-spacing: -0.01em; margin: 0 0 6px; }
.d-meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: center; margin: 18px 0; padding: 14px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.verdict .big { font: 600 46px/1 var(--sans); font-variant-numeric: tabular-nums; grid-row: span 2; letter-spacing: -0.02em; }
.verdict .why { font-size: 16px; }
.verdict .who { font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.posting { font: 400 17.5px/1.62 var(--serif); max-width: 68ch; margin-top: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.posting.thin { color: var(--muted); font-style: italic; }
.drafts-inline { margin-top: 10px; font-size: 14px; }
.back { display: none; }

/* ---------------------------------------------------------------------
   Logs, toasts, sections
   --------------------------------------------------------------------- */
.log {
  background: var(--log-bg); color: var(--log-ink); border-radius: var(--r);
  font: 12.5px/1.55 var(--mono); padding: 12px 14px; overflow: auto;
  white-space: pre-wrap; overflow-wrap: anywhere; min-height: 120px; max-height: 60vh;
}
.log .bad { color: #FF9C94; } .log .warn { color: #F2C66D; } .log .good { color: #7FD7A8; }
.log-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 8px; flex-wrap: wrap; }
.log-head code { font: 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.status-dot { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; }
.status-dot.ok { color: var(--ok); } .status-dot.fail { color: var(--danger); }

.section { padding: 20px 0 22px; border-top: 1px solid var(--line); }
.section:first-of-type { border-top: 0; padding-top: 4px; }
.section-grid { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 24px; align-items: start; }
.panel { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }

.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 36px)); }
.toast { background: var(--ink); color: var(--raised); border-radius: var(--r); padding: 11px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 24px rgba(10,20,30,.22); }
.toast .btn.quiet { color: inherit; text-decoration: underline; }
.toast.bad { background: var(--danger); color: #fff; }
.toast .msg { flex: 1; }

table.plain { border-collapse: collapse; width: 100%; font-size: 14px; }
table.plain th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
table.plain td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.problem { color: var(--danger); font-size: 13px; }

/* drafts */
.drafts { display: grid; grid-template-columns: minmax(280px, 34%) 1fr; gap: 14px; align-items: start; }
.draftrow { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line-soft); background: none; padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent; }
.draftrow:hover { background: var(--surface); }
.draftrow[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.draftrow .ti { font-weight: 600; } .draftrow .co { color: var(--muted); font-size: 13.5px; }
.rec-apply { color: var(--strong); } .rec-manual_review { color: var(--review); } .rec-do_not_apply { color: var(--danger); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
textarea.letter { width: 100%; min-height: 420px; font: 400 17px/1.6 var(--serif); padding: 16px 18px; resize: vertical; }
textarea.code { width: 100%; font: 13px/1.6 var(--mono); padding: 12px 14px; resize: vertical; tab-size: 2; white-space: pre; }

/* settings editor */
.editor { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: start; }
.outline { position: sticky; top: 14px; display: flex; flex-direction: column; font-size: 14px; max-height: calc(100vh - 120px); overflow-y: auto; }
.outline button { text-align: left; background: none; border: 0; padding: 4px 8px; cursor: pointer; border-radius: var(--r-small); color: var(--ink); }
.outline button:hover { background: var(--line-soft); }
.msgs { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
.msgs li { padding: 6px 10px; border-radius: var(--r-small); margin-bottom: 4px; }
.msgs .e { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.msgs .w { background: color-mix(in srgb, var(--maybe) 14%, transparent); color: var(--maybe); }

iframe.digest { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }

/* ---------------------------------------------------------------------
   Narrow screens: sidebar becomes a top bar, list and detail stack
   --------------------------------------------------------------------- */
@media (max-width: 920px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; gap: 12px; overflow-x: auto; }
  .mark { font-size: 22px; } .mark small, .side-foot { display: none; }
  nav { flex-direction: row; }
  nav a { white-space: nowrap; }
  .list-head .faint { display: none; }
  nav a .count { display: none; }
  .page { padding: 16px 14px 32px; }
  .split, .drafts, .section-grid, .editor { grid-template-columns: 1fr; }
  .outline { display: none; }
  .split.show-detail .list, .drafts.show-detail .list { display: none; }
  .split:not(.show-detail) .detail { display: none; }
  .detail { position: static; max-height: none; padding: 18px; }
  .back { display: inline-flex; margin-bottom: 10px; }
  .verdict .big { font-size: 38px; }
  #assist-wrap { left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 72vh; }
}

/* Bookmarks -------------------------------------------------------------- */
.jobrow { position: relative; }
.star {
  position: absolute; right: 6px; bottom: 5px; line-height: 1;
  font-size: 15px; color: var(--muted); opacity: .35; padding: 2px 4px;
  border-radius: 4px; cursor: pointer; transition: opacity .12s, color .12s;
}
.jobrow:hover .star, .star:focus-visible { opacity: .85; }
.star.on { opacity: 1; color: #d98a00; }
.star:hover { opacity: 1; color: #d98a00; background: var(--surface); }
.star:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.star-btn.on { color: #d98a00; border-color: currentColor; }
.chip.star-chip[aria-pressed="true"] { color: #d98a00; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .star.on,
  :root:not([data-theme="light"]) .star:hover,
  :root:not([data-theme="light"]) .star-btn.on,
  :root:not([data-theme="light"]) .chip.star-chip[aria-pressed="true"] { color: #f0b429; }
}
:root[data-theme="dark"] .star.on,
:root[data-theme="dark"] .star:hover,
:root[data-theme="dark"] .star-btn.on,
:root[data-theme="dark"] .chip.star-chip[aria-pressed="true"] { color: #f0b429; }

/* Assistant ------------------------------------------------------------- */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
#assist-wrap { position: fixed; right: 18px; bottom: 18px; width: min(460px, calc(100vw - 36px));
  max-height: min(76vh, 720px); z-index: 60; display: none; }
#assist-wrap.open { display: block; }
#assist-wrap .assist-card { max-height: inherit; overflow: auto;
  box-shadow: 0 18px 48px rgba(0, 0, 0, .22); }
#assist-wrap textarea { width: 100%; font: inherit; }
.assist-answer { font-size: 14px; line-height: 1.55; }
.assist-answer h3 { font-size: 13px; margin: 12px 0 4px; }
.assist-answer p { margin: 8px 0; }
.assist-answer ul { margin: 8px 0; padding-left: 20px; }
.assist-answer li { margin: 3px 0; }
.assist-answer code { font-size: 12.5px; background: var(--sunken, rgba(127,127,127,.14));
  padding: 1px 4px; border-radius: 3px; }
/* The card floats over the page, so while it is open the content gets room
   to scroll clear of it. Without this it sits on top of the very buttons
   that opened it. */
body.assist-open .page { padding-bottom: 46vh; }
@media (min-width: 1240px) {
  body.assist-open .page { padding-right: 500px; padding-bottom: 32px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <p class="mark">jobscan<small id="side-sub">Loading</small></p>
    <nav id="nav" aria-label="Sections">
      <a href="#/postings" data-page="postings">Postings <span class="count" id="nav-postings"></span></a>
      <a href="#/run" data-page="run">Run a scan</a>
      <a href="#/drafts" data-page="drafts">Drafts <span class="count" id="nav-drafts"></span></a>
      <a href="#/scoring" data-page="scoring">Scoring</a>
      <a href="#/models" data-page="models">Models</a>
      <a href="#/settings" data-page="settings">Settings</a>
      <a href="#/resume" data-page="resume">Resume facts</a>
      <a href="#/health" data-page="health">Health</a>
      <a href="#" id="nav-assist">Ask for help</a>
    </nav>
    <div class="side-foot">
      <p id="side-last"></p>
      <div class="tasks-mini" id="tasks-mini"></div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =======================================================================
   Core
   ======================================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TIERS = ["strong", "review", "maybe", "weak", "unscored"];
const TIER_WORD = {
  career: { strong: "Strong", review: "Review", maybe: "Maybe", weak: "Weak", unscored: "Unscored" },
  bridge: { strong: "Good fit", review: "Review", maybe: "Maybe", weak: "Poor fit", unscored: "Unscored" },
};
const STATUS_WORD = { new: "New", saved: "Saved", applied: "Applied", dismissed: "Dismissed" };

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (init.method !== "GET") {
    init.headers["X-Jobscan"] = "1";
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body || {});
  }
  const res = await fetch("/api/" + path, init);
  let data;
  try { data = await res.json(); } catch { data = {}; }
  if (!res.ok && !opts.allowError) throw new Error(data.error || `Request failed (${res.status})`);
  return opts.allowError ? { ok: res.ok, data } : data;
}
const qs = (o) => Object.entries(o).filter(([, v]) => v !== "" && v != null && v !== false)
  .map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  const d = Math.round(s / 86400);
  return d === 1 ? "yesterday" : `${d} days ago`;
}
function shortAgo(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
}

/* ---- toasts ---------------------------------------------------------- */
function toast(msg, { bad = false, action = null, ms = 4200 } = {}) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.innerHTML = `<span class="msg">${esc(msg)}</span>`;
  if (action) {
    const b = document.createElement("button");
    b.className = "btn quiet"; b.textContent = action.label;
    b.onclick = () => { action.run(); el.remove(); };
    el.appendChild(b);
  }
  const x = document.createElement("button");
  x.className = "btn quiet"; x.setAttribute("aria-label", "Dismiss"); x.textContent = "Close";
  x.onclick = () => el.remove();
  el.appendChild(x);
  $("#toasts").appendChild(el);
  if (ms) setTimeout(() => el.remove(), ms);
}
const fail = (e) => toast(e.message || String(e), { bad: true, ms: 8000 });

/* ---- tasks: every script run, polled while anything is running --------- */
const Tasks = {
  known: new Map(), watchers: new Map(), timer: null,
  async start(kind, options, { onDone, quietToast } = {}) {
    const run = await api("runs", { method: "POST", body: { kind, options } });
    this.known.set(run.id, run);
    if (onDone) this.watchers.set(run.id, onDone);
    if (!quietToast) toast(`Started: ${run.label}`, { action: { label: "View log", run: () => go(`#/run/${run.id}`) } });
    this.poll();
    return run;
  },
  poll() { clearTimeout(this.timer); this.timer = setTimeout(() => this.tick(), 900); },
  async tick() {
    let runs = [];
    try { runs = await api("runs"); } catch { return this.poll(); }
    for (const r of runs) {
      const before = this.known.get(r.id);
      if (before && before.running && !r.running) this.finished(r);
      this.known.set(r.id, r);
    }
    renderTasksMini(runs);
    if (Router.page === "run") RunPage.refreshList(runs);
    if (runs.some((r) => r.running)) this.poll();
  },
  finished(r) {
    const cb = this.watchers.get(r.id);
    this.watchers.delete(r.id);
    const ok = r.code === 0;
    toast(`${ok ? "Finished" : "Failed"}: ${r.label}`, {
      bad: !ok, ms: ok ? 5000 : 10000,
      action: { label: "View log", run: () => go(`#/run/${r.id}`) },
    });
    if (cb) cb(r);
    refreshSide();
  },
};
function renderTasksMini(runs) {
  const live = runs.filter((r) => r.running);
  $("#tasks-mini").innerHTML = live.map((r) =>
    `<a href="#/run/${r.id}"><span class="spin" aria-hidden="true"></span>${esc(r.label)}</a>`).join("");
}

/* ---- sidebar --------------------------------------------------------- */
async function refreshSide() {
  try {
    const s = await api("summary");
    App.summary = s;
    $("#side-sub").textContent = `${s.total.toLocaleString()} postings stored`;
    $("#side-last").textContent = s.last_run
      ? `Last scan ${ago(s.last_run)}, ${s.last_run_count} new` : "No scans yet";
    $("#nav-postings").textContent = s.total ? s.total.toLocaleString() : "";
  } catch (e) { $("#side-sub").textContent = "Server not answering"; }
}

/* ---- router ---------------------------------------------------------- */
const App = { summary: null, models: null };
const go = (hash) => { if (location.hash === hash) Router.render(); else location.hash = hash; };
const Router = {
  page: null,
  pages: {},
  render() {
    const [, page = "postings", ...rest] = location.hash.split("/");
    const name = this.pages[page] ? page : "postings";
    this.page = name;
    $$("#nav a").forEach((a) => { if (a.dataset.page !== name) a.removeAttribute("aria-current"); else a.setAttribute("aria-current", "page"); });
    const main = $("#main");
    main.innerHTML = "";
    main.scrollTop = 0;
    this.pages[name].render(main, rest.map(decodeURIComponent));
  },
};
window.addEventListener("hashchange", () => Router.render());

/* ---- small builders -------------------------------------------------- */
function seg(options, value, onChange, label) {
  const el = document.createElement("div");
  el.className = "seg"; el.setAttribute("role", "group");
  if (label) el.setAttribute("aria-label", label);
  for (const [v, text] of options) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = text; b.dataset.v = v;
    b.setAttribute("aria-pressed", String(v === value));
    b.onclick = () => {
      $$("button", el).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      onChange(v);
    };
    el.appendChild(b);
  }
  return el;
}
function logHtml(lines) {
  return lines.map((l) => {
    const e = esc(l);
    if (/^\s*(\[ FAIL \]|!!|Traceback|error:|\s*! )/.test(l) || /Error:/.test(l)) return `<span class="bad">${e}</span>`;
    if (/^\s*(\[ warn \]|  ! )/.test(l)) return `<span class="warn">${e}</span>`;
    if (/^\s*\[  ok  \]/.test(l) || /^(Done\.|All clear)/.test(l)) return `<span class="good">${e}</span>`;
    return e;
  }).join("\n");
}
/* A live log inside any page: start a task, stream it, call back at the end. */
function inlineRunner(container, { onDone } = {}) {
  container.innerHTML = "";
  let id = null, next = 0, timer = null, lines = [];
  const head = document.createElement("div"); head.className = "log-head";
  const pre = document.createElement("pre"); pre.className = "log";
  pre.textContent = "Output appears here.";
  container.append(head, pre);
  async function pump() {
    if (!id) return;
    try {
      const r = await api(`runs/${id}?since=${next}`);
      lines = lines.concat(r.lines); next = r.next;
      const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
      pre.innerHTML = logHtml(lines) || "Waiting for output";
      if (atBottom) pre.scrollTop = pre.scrollHeight;
      head.innerHTML = `<code>${esc(r.command)}</code>` + (r.running
        ? `<span class="row" style="align-items:center"><span class="status-dot"><span class="spin"></span>Running</span><button class="btn danger" data-stop>Stop</button></span>`
        : `<span class="status-dot ${r.code === 0 ? "ok" : "fail"}">${r.code === 0 ? "Finished" : `Exited with code ${r.code}`}</span>`);
      const stop = head.querySelector("[data-stop]");
      if (stop) stop.onclick = () => api(`runs/${id}/stop`, { method: "POST" }).then(() => toast("Stopping")).catch(fail);
      if (r.running) timer = setTimeout(pump, 700);
      else if (onDone) onDone(r);
    } catch (e) { pre.textContent = e.message; }
  }
  return {
    async run(kind, options) {
      clearTimeout(timer); lines = []; next = 0;
      pre.textContent = "Starting";
      try {
        const r = await Tasks.start(kind, options, { quietToast: true });
        id = r.id; pump();
      } catch (e) { pre.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
    },
    attach(runId) { clearTimeout(timer); id = runId; lines = []; next = 0; pump(); },
  };
}
async function models() {
  if (!App.models) App.models = await api("models");
  return App.models;
}
function modelOptions(m, { generativeOnly = false, blank = "Configured default" } = {}) {
  return `<option value="">${esc(blank)}</option>` + m.profiles
    .filter((p) => !generativeOnly || p.generative)
    .map((p) => `<option value="${esc(p.name)}">${esc(p.name)}${p.model ? ` (${esc(p.model)})` : ""}</option>`).join("");
}

/* =======================================================================
   Postings
   ======================================================================= */
const Postings = {
  f: { track: "career", tier: "", status: "open", days: "", run: "", q: "", deep: "", scorer: "", sort: "fit" },
  rows: [], total: 0, offset: 0, selected: null, hist: null, lines: null,
  render(root) {
    const f = this.f;
    root.innerHTML = `<div class="page">
      <div class="page-head">
        <h1>Postings</h1>
        <span id="p-track"></span>
        <span class="muted" id="p-method"></span>
      </div>
      <div class="strip-wrap" id="strip-wrap"></div>
      <div class="filters">
        <div class="chips" id="p-tiers" role="group" aria-label="Tier"></div>
        <select id="p-status" aria-label="My status">
          <option value="open">Open (new and saved)</option><option value="new">New</option>
          <option value="saved">Saved</option><option value="applied">Applied</option>
          <option value="dismissed">Dismissed</option><option value="">Any status</option>
        </select>
        <select id="p-when" aria-label="Found">
          <option value="">Found any time</option><option value="last">In the last scan</option>
          <option value="1">In the last day</option><option value="7">In the last week</option>
          <option value="30">In the last month</option>
        </select>
        <select id="p-scorer" aria-label="Scored by">
          <option value="">Any scorer</option><option value="jev">jev</option>
          <option value="rubric">Rubric</option><option value="keyword">Keywords only</option>
        </select>
        <input type="search" id="p-q" class="grow" placeholder="Search title, employer, place or reason" aria-label="Search">
        <label class="check"><input type="checkbox" id="p-deep"> Include posting text</label>
        <span id="p-sort"></span>
      </div>
      <div class="filters" id="p-seen" role="group" aria-label="Already looked at"></div>
      <div class="split" id="p-split">
        <section class="list" aria-label="Results">
          <div class="list-head"><span id="p-count"></span><span class="faint">j and k to move, o to open</span></div>
          <div id="p-rows"></div>
          <div class="more hidden" id="p-more"><button class="btn" id="p-more-btn">Show more</button></div>
        </section>
        <section class="detail" id="p-detail" aria-label="Posting"><div class="empty">Choose a posting to read it.</div></section>
      </div>
    </div>`;
    $("#p-track").appendChild(seg([["career", "Career"], ["bridge", "Bridge"], ["all", "Both"]],
      f.track, (v) => { f.track = v; this.reload(true); }, "Track"));
    $("#p-sort").appendChild(seg([["fit", "Best fit"], ["newest", "Newest"]], f.sort,
      (v) => { f.sort = v; this.reload(); }, "Sort"));
    $("#p-status").value = f.status;
    $("#p-when").value = f.run === "last" ? "last" : f.days;
    $("#p-scorer").value = f.scorer;
    $("#p-q").value = f.q; $("#p-deep").checked = !!f.deep;
    $("#p-status").onchange = (e) => { f.status = e.target.value; this.reload(); };
    $("#p-when").onchange = (e) => {
      const v = e.target.value; f.run = v === "last" ? "last" : ""; f.days = v === "last" ? "" : v;
      this.reload(true);
    };
    $("#p-scorer").onchange = (e) => { f.scorer = e.target.value; this.reload(); };
    let t; $("#p-q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { f.q = e.target.value; this.reload(); }, 220); };
    $("#p-deep").onchange = (e) => { f.deep = e.target.checked ? "1" : ""; if (f.q) this.reload(); };
    $("#p-more-btn").onclick = () => this.load(true);
    this.reload(true);
  },
  params(extra = {}) {
    const f = this.f;
    return qs({ track: f.track === "all" ? "" : f.track, tier: f.tier, status: f.status, days: f.days, run: f.run,
      q: f.q, deep: f.deep, scorer: f.scorer, sort: f.sort,
      bookmarked: f.bookmarked ? 1 : "",
      hide_reviewed: f.hideReviewed ? 1 : "", hide_skipped: f.hideSkipped ? 1 : "",
      hide_drafted: f.hideDrafted ? 1 : "", ...extra });
  },
  async reload(strip = false) {
    this.offset = 0;
    await this.load(false);
    if (strip) this.loadStrip();
    const m = App.summary?.methods?.[this.f.track];
    $("#p-method").textContent = m ? `Scored by ${m.method}${m.model ? ` on ${m.model.split(" (")[0]}` : ""}` : "";
  },
  async load(append) {
    try {
      const d = await api("jobs?" + this.params({ limit: 80, offset: append ? this.offset : 0 }));
      this.rows = append ? this.rows.concat(d.rows) : d.rows;
      this.total = d.total; this.offset = this.rows.length;
      this.drawTiers(d.tiers);
      this.drawSeen(d.seen || {});
      this.drawRows();
      if (!append) {
        const keep = this.rows.find((r) => r.uid === this.selected);
        // A filter that emptied the list leaves "Nothing matches" in the
        // detail pane. When rows come back and the selected one is among
        // them, highlighting alone would leave that message sitting next
        // to a list that plainly does match.
        if (keep) {
          this.highlight();
          if ($("#p-detail")?.querySelector(".empty")) this.open(keep.uid);
        } else if (this.rows[0] && innerWidth > 920) this.open(this.rows[0].uid);
        else if (!this.rows.length) $("#p-detail").innerHTML = `<div class="empty">Nothing matches these filters.</div>`;
      }
    } catch (e) { fail(e); }
  },
  drawTiers(counts) {
    const el = $("#p-tiers"); if (!el) return;
    const words = TIER_WORD[this.f.track === "bridge" ? "bridge" : "career"];
    const total = TIERS.reduce((a, t) => a + (counts[t] || 0), 0);
    el.innerHTML = [["", "All", total], ...TIERS.map((t) => [t, words[t], counts[t] || 0])]
      .map(([t, w, n]) => `<button class="chip ${t ? "t-" + t : ""}" data-t="${t}" aria-pressed="${this.f.tier === t}">${w}<span class="n">${n}</span></button>`).join("")
      + `<button class="chip star-chip" id="p-bm" aria-pressed="${!!this.f.bookmarked}" title="Show only bookmarked postings">★ Bookmarked</button>`;
    $$(".chip[data-t]", el).forEach((b) => b.onclick = () => { this.f.tier = b.dataset.t; this.reload(); });
    $("#p-bm").onclick = () => { this.f.bookmarked = !this.f.bookmarked; this.reload(); };
  },
  /* Postings a past tailor run already settled. Hiding them is the point:
     once you have decided about a job, it is noise in a list you are
     scanning for new ones. The counts stay visible so hiding never means
     forgetting. */
  drawSeen(counts) {
    const el = $("#p-seen"); if (!el) return;
    const boxes = [
      ["hideReviewed", "review", "Hide reviewed", "Analysed, stopped before drafting"],
      ["hideSkipped", "skipped", "Hide not worth it", "Analysed as not worth applying to"],
      ["hideDrafted", "drafted", "Hide drafted", "Already has a letter or resume"],
    ];
    const total = boxes.reduce((a, [, k]) => a + (counts[k] || 0), 0);
    if (!total && !boxes.some(([f]) => this.f[f])) { el.innerHTML = ""; return; }
    el.innerHTML = `<span class="muted" style="font-size:12.5px">Already looked at:</span>` +
      boxes.map(([f, k, label, tip]) =>
        `<label class="check" title="${tip}"><input type="checkbox" data-seen="${f}"
          ${this.f[f] ? "checked" : ""}> ${label}<span class="n"> ${counts[k] || 0}</span></label>`).join("");
    $$("[data-seen]", el).forEach((cb) => cb.onchange = () => {
      this.f[cb.dataset.seen] = cb.checked; this.reload();
    });
  },
  drawRows() {
    const words = (tr) => TIER_WORD[tr === "bridge" ? "bridge" : "career"];
    $("#p-count").textContent = `${this.total.toLocaleString()} posting${this.total === 1 ? "" : "s"}`;
    $("#p-rows").innerHTML = this.rows.map((r) => {
      const st = r.status !== "new" ? `<span class="pill ${r.status}">${STATUS_WORD[r.status]}</span>` : "";
      // Three outcomes of a past tailor run, not one. "Looked at and
      // stopped" and "looked at and rejected" were both invisible before,
      // so a posting you had already decided about looked untouched.
      const dr = { drafted: `<span class="pill drafted">Drafted</span>`,
                   review: `<span class="pill reviewed" title="Analysed, stopped before drafting">Reviewed</span>`,
                   skipped: `<span class="pill skipped" title="Analysed as not worth applying to">Not worth it</span>`,
                 }[r.tailor.state] || "";
      // A span, not a button: this sits inside the row button, and nesting
      // one button in another is invalid and behaves unpredictably.
      const star = `<span class="star${r.bookmarked ? " on" : ""}" data-star="${esc(r.uid)}"
        role="button" tabindex="0" aria-pressed="${!!r.bookmarked}"
        aria-label="${r.bookmarked ? "Remove bookmark" : "Bookmark this posting"}"
        title="${r.bookmarked ? "Bookmarked" : "Bookmark (b)"}">${r.bookmarked ? "★" : "☆"}</span>`;
      return `<button class="jobrow ${r.status === "dismissed" ? "dim" : ""}" data-uid="${esc(r.uid)}" role="option">
        <span class="sc t-${r.tier_now}" title="${esc(words(r.track)[r.tier_now])}">${r.score ?? "–"}</span>
        <span class="ti">${esc(r.title)}</span>
        <span class="side-r"><span>${shortAgo(r.first_seen)}</span>${st || dr}</span>
        <span class="co">${esc(r.company)}${r.location ? `, ${esc(r.location)}` : ""}${this.f.track === "all" && r.track === "bridge" ? " (bridge)" : ""}</span>
        ${star}
      </button>`;
    }).join("") || `<div class="more muted">No postings here. Try another tier, or widen “Found”.</div>`;
    $("#p-more").classList.toggle("hidden", this.rows.length >= this.total);
    $$(".jobrow").forEach((b) => b.onclick = () => this.open(b.dataset.uid));
    $$("[data-star]").forEach((s) => {
      const hit = (e) => { e.stopPropagation(); e.preventDefault(); this.toggleBookmark(s.dataset.star); };
      s.onclick = hit;
      s.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") hit(e); };
    });
    this.highlight();
  },
  async toggleBookmark(uid, force) {
    const r = this.rows.find((x) => x.uid === uid);
    const on = force !== undefined ? force : !(r && r.bookmarked);
    try {
      await api("job/bookmark", { method: "POST", body: { uid, on } });
      if (r) r.bookmarked = on;
      // Redraw rather than patch, so the row, the detail and the filter
      // count cannot drift apart.
      if (this.f.bookmarked && !on) { this.load(false); }
      else { this.drawRows(); if (this.selected === uid) this.open(uid); }
      toast(on ? "Bookmarked" : "Bookmark removed");
    } catch (e) { fail(e); }
  },
  highlight() {
    $$(".jobrow").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.uid === this.selected)));
  },
  async open(uid, scroll = false) {
    this.selected = uid; this.highlight();
    $("#p-split")?.classList.add("show-detail");
    if (scroll) $(`.jobrow[aria-selected="true"]`)?.scrollIntoView({ block: "nearest" });
    try {
      const j = await api("job?" + qs({ uid }));
      if (this.selected === uid) {
        this.drawDetail(j);
        if (innerWidth <= 920) $("#p-detail").scrollIntoView({ block: "start" });
      }
    } catch (e) { fail(e); }
  },
  drawDetail(j) {
    const words = TIER_WORD[j.track];
    const scorer = j.scorer === "keyword" ? "Keyword estimate, not read by a model"
      : j.scorer === "rule" ? "Ruled out by a date check"
      : j.scorer ? `Scored by ${j.scorer === "anthropic" ? "rubric" : j.scorer}${j.scorer_model ? ` on ${j.scorer_model}` : ""}` : "";
    const desc = j.description || "";
    // Too thin to draft from. An Adzuna excerpt clears a bare length test
    // but stops the tailor, so flag it here and offer the fetch.
    const thin = desc.trim().length < 900 || j.desc_quality === "excerpt";
    const files = j.tailor.files || [];
    const el = $("#p-detail");
    el.innerHTML = `
      <button class="btn quiet back" id="d-back">Back to list</button>
      <h2 class="d-title">${esc(j.title)}</h2>
      <div class="d-meta">
        <span>${esc(j.company)}</span><span>${esc(j.location)}</span>
        ${j.salary ? `<span>${esc(j.salary)}</span>` : ""}
        ${j.posted ? `<span>Posted ${esc(j.posted)}</span>` : ""}
        <span>Found ${ago(j.first_seen)} on ${esc(j.source)}</span>
        ${j.track === "bridge" ? "<span>Bridge track</span>" : ""}
      </div>
      <div class="verdict">
        <span class="big t-${j.tier_now}">${j.score ?? "–"}</span>
        <span class="why"><span class="tierword t-${j.tier_now}">${words[j.tier_now]}.</span> ${esc(j.reason || "")}</span>
        <span class="who">${esc(scorer)}</span>
      </div>
      <div class="actions" id="d-status">
        <button class="btn star-btn${j.bookmarked ? " on" : ""}" id="d-star" aria-pressed="${!!j.bookmarked}">${j.bookmarked ? "★ Bookmarked" : "☆ Bookmark"}</button>
      </div>
      <div class="actions">
        ${j.url ? `<a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open the posting</a>` : ""}
        <button class="btn" data-mode="letter">Draft a letter</button>
        <button class="btn" data-mode="resume">Tailor my resume</button>

      </div>
      <div class="actions">
        <label class="field" style="max-width:260px">Second opinion from<select id="d-rmodel"></select></label>
        <button class="btn quiet" id="d-review">Re-review this posting</button>
      </div>

      <div id="d-reviewlog"></div>
      ${thin ? `<p class="hint">Only ${desc.length} characters are stored for this posting, which is usually a truncated feed excerpt. Drafting fetches the full text automatically; "Fetch the full posting" does it now and keeps it.</p>` : ""}
      <div id="d-fetchlog"></div><div id="d-pastebox"></div>
      ${files.length ? `<div class="drafts-inline">Already drafted: ${files.filter((f) => f.kind !== "analysis").map((f) =>
        `<a href="#/drafts/${encodeURIComponent(j.tailor.stem)}/${f.kind}">${f.kind}</a>`).join(", ") || "analysis only"}
        ${j.tailor.rec ? `(${esc(j.tailor.rec.replaceAll("_", " "))})` : ""}</div>` : ""}
      <div class="posting ${desc.length < 400 ? "thin" : ""}">${esc(desc) || "No description was retrieved for this posting. Open it to read the original."}</div>`;
    $("#d-back").onclick = () => $("#p-split").classList.remove("show-detail");

    $("#d-status").appendChild(seg(Object.entries(STATUS_WORD), j.status, (v) => this.setStatus(j.uid, v), "My status"));
    $$("[data-mode]", el).forEach((b) => b.onclick = () => this.tailor(j, b.dataset.mode));
    $("#d-rescore").onclick = () => Tasks.start("backfill", { uid: j.uid, title: j.title },
      { onDone: () => { this.open(j.uid); this.load(false); } });
    if ($("#d-fetch")) {
      const fr = inlineRunner($("#d-fetchlog"), { onDone: async (r) => {
        // Did the fetch actually help? Re-read the row rather than trust
        // the exit code: enrich exits 0 having politely found nothing.
        let still = true;
        try {
          const fresh = await api("job?" + qs({ uid: j.uid }));
          still = (fresh.description || "").trim().length < 900
                  || fresh.desc_quality === "excerpt";
        } catch { /* fall through to offering the paste box */ }
        if (still) this.pasteBox(j, true);
        else this.open(j.uid);
      } });
      $("#d-fetch").onclick = () => fr.run("enrich", { uid: j.uid });
    }
    if ($("#d-paste")) $("#d-paste").onclick = () => this.pasteBox(j, false);
    // The model list is fetched rather than inlined, because drawDetail is
    // synchronous and a posting should render without waiting on it.
    models().then((m) => {
      const sel = $("#d-rmodel");
      if (sel) sel.innerHTML = modelOptions(m, { generativeOnly: true });
    }).catch(() => {});
    if ($("#d-review")) {
      const rr = inlineRunner($("#d-reviewlog"), { onDone: () => this.open(j.uid) });
      $("#d-review").onclick = () => rr.run("review",
        { uid: j.uid, title: j.title, model: $("#d-rmodel").value });
    }
  },
  async setStatus(uid, status) {
    try {
      const r = this.rows.find((x) => x.uid === uid);
      const prev = r?.status || "new";
      await api("job/status", { method: "POST", body: { uid, status } });
      if (r) r.status = status;
      const hides = (this.f.status === "open" && !["new", "saved"].includes(status))
        || (this.f.status && this.f.status !== "open" && this.f.status !== status);
      if (hides) {
        const i = this.rows.findIndex((x) => x.uid === uid);
        this.rows.splice(i, 1); this.total -= 1; this.drawRows();
        const nxt = this.rows[Math.min(i, this.rows.length - 1)];
        if (nxt) this.open(nxt.uid, true);
        toast(`Marked ${STATUS_WORD[status].toLowerCase()}`, { action: { label: "Undo", run: () => {
          api("job/status", { method: "POST", body: { uid, status: prev } }).then(() => this.reload()).catch(fail); } } });
      } else { this.drawRows(); }
    } catch (e) { fail(e); }
  },
  /* Some postings cannot be fetched: the page needs JavaScript, or the host
     refuses anything that is not a person with a browser. Rather than leave
     that as a dead end, take the text by hand and store it, which repairs
     the row for scoring and every later run too. */
  pasteBox(j, afterFailedFetch) {
    const box = $("#d-pastebox");
    if (!box) return;
    box.innerHTML = `<div class="panel stack" style="margin-top:12px">
      <h3 style="margin:0">${afterFailedFetch ? "Content inaccessible" : "Paste the posting"}</h3>
      <p class="hint">${afterFailedFetch
        ? `The posting could not be read from ${esc(j.url ? new URL(j.url).hostname : "that link")}. Open it yourself, copy the whole description, and paste it below.`
        : "Copy the whole description from the posting and paste it below."}
        It is saved to this job, so scoring and drafting both use it from now on.</p>
      ${j.url ? `<p class="hint"><a href="${esc(j.url)}" target="_blank" rel="noopener">Open the posting in a new tab</a></p>` : ""}
      <label class="field"><span class="sr-only">The posting text</span>
        <textarea id="d-ptext" rows="10" class="code" style="white-space:pre-wrap"
          placeholder="Title, employer, duties, requirements. Everything the posting says."></textarea></label>
      <div class="row"><button class="btn primary" id="d-psave">Save and draft</button>
        <button class="btn" id="d-psaveonly">Save only</button>
        <button class="btn quiet" id="d-pcancel">Cancel</button>
        <span class="hint" id="d-pcount">0 characters</span></div></div>`;
    const ta = $("#d-ptext");
    ta.focus();
    const count = () => { $("#d-pcount").textContent = `${ta.value.trim().length} characters`; };
    ta.addEventListener("input", count);
    const save = async () => {
      const text = ta.value.trim();
      if (text.length < 200) { toast(`Only ${text.length} characters. Paste the whole posting.`, { bad: true }); return false; }
      try {
        const r = await api("job/description", { method: "POST", body: { uid: j.uid, text } });
        toast(`Saved ${r.chars} characters to this posting`);
        return true;
      } catch (e) { fail(e); return false; }
    };
    $("#d-psave").onclick = async () => {
      if (!(await save())) return;
      const fresh = await api("job?" + qs({ uid: j.uid })).catch(() => j);
      box.innerHTML = "";
      this.drawDetail(fresh);
      this.tailor(fresh, "both");
    };
    $("#d-psaveonly").onclick = async () => { if (await save()) { box.innerHTML = ""; this.open(j.uid); } };
    $("#d-pcancel").onclick = () => box.innerHTML = "";
  },

  tailor(j, mode, opts = {}) {
    const pdf = $("#d-pdf")?.checked || false;
    Tasks.start("tailor", { uid: j.uid, title: j.title, mode, pdf, ...opts },
      { onDone: (r) => {
        if (this.selected === j.uid) this.open(j.uid);
        if (r.code === 0) {
          toast("Drafts are ready", { action: { label: "Open drafts", run: () => go("#/drafts") } });
        } else if (r.code === 4) {
          // 4 is "I could not decide", usually a posting too thin to judge.
          // Offer the override here rather than make them retype a command.
          toast("Stopped for manual review. Read the analysis first.", {
            bad: true, ms: 9000,
            action: { label: "Draft anyway", run: () => this.tailor(j, mode, { force: true }) } });
        } else if (r.code === 3) {
          toast("Analysed as not worth applying to.", { bad: true, ms: 7000,
            action: { label: "Draft anyway", run: () => this.tailor(j, mode, { force: true }) } });
        }
      } });
  },

  /* ---- the score strip ------------------------------------------------ */
  async loadStrip() {
    const wrap = $("#strip-wrap"); if (!wrap) return;
    if (this.f.track === "all") {
      wrap.innerHTML = `<div class="hint">Career and bridge scores answer different questions, so each has its own lines. Pick one track to see and move them.</div>`;
      return;
    }
    try {
      this.hist = await api("histogram?" + qs({ track: this.f.track, days: this.f.days }));
      this.lines = { strong: this.hist.strong_at, maybe: this.hist.maybe_at };
      this.drawStrip();
    } catch (e) { wrap.innerHTML = `<div class="problem">${esc(e.message)}</div>`; }
  },
  drawStrip() {
    const h = this.hist, L = this.lines, wrap = $("#strip-wrap");
    const words = TIER_WORD[this.f.track];
    const max = Math.max(1, ...h.bins);
    const counts = { weak: 0, maybe: 0, strong: 0 };
    h.bins.forEach((n, s) => { counts[s >= L.strong ? "strong" : s >= L.maybe ? "maybe" : "weak"] += n; });
    const changed = L.strong !== h.strong_at || L.maybe !== h.maybe_at;
    wrap.innerHTML = `
      <div class="strip-top">
        <div class="zones">
          <span class="muted">All ${h.bins.reduce((a, n) => a + n, 0)} scored:</span>
          <span class="t-strong">${words.strong} <b>${counts.strong}</b></span>
          <span class="t-maybe">${words.maybe} <b>${counts.maybe}</b></span>
          <span class="t-weak">${words.weak} <b>${counts.weak}</b></span>
          <span class="muted">${h.review} flagged for review, ${h.unscored} not read by a model</span>
        </div>
        <div class="strip-actions">
          ${changed ? `<span class="muted">Was ${h.maybe_at} and ${h.strong_at}</span>
            <button class="btn quiet" id="s-reset">Reset</button>
            <button class="btn primary" id="s-save">Save these lines</button>`
            : `<span class="faint">Drag a line to see how the tiers would change</span>`}
        </div>
      </div>
      <div class="strip" id="strip">
        <svg viewBox="0 0 1010 92" preserveAspectRatio="none" aria-hidden="true">
          <rect x="${L.strong * 10}" y="0" width="${1010 - L.strong * 10}" height="76" fill="var(--strong)" opacity=".07"/>
          <rect x="${L.maybe * 10}" y="0" width="${(L.strong - L.maybe) * 10}" height="76" fill="var(--maybe)" opacity=".07"/>
          ${h.bins.map((n, s) => n ? `<rect x="${s * 10 + 1}" y="${76 - Math.max(2, (n / max) * 72)}" width="8" height="${Math.max(2, (n / max) * 72)}"
             fill="var(--${s >= L.strong ? "strong" : s >= L.maybe ? "maybe" : "weak"})" rx="1"/>` : "").join("")}
          <line x1="0" x2="1010" y1="76.5" y2="76.5" stroke="var(--line)"/>
        </svg>
        <div class="handle maybe" id="h-maybe" tabindex="0" role="slider" aria-label="Maybe line" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${L.maybe}" style="left:${(L.maybe + 0.5) / 101 * 100}%"><span>Maybe ${L.maybe}</span></div>
        <div class="handle strong" id="h-strong" tabindex="0" role="slider" aria-label="Strong line" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${L.strong}" style="left:${(L.strong + 0.5) / 101 * 100}%"><span>${words.strong} ${L.strong}</span></div>
        <div class="strip-axis">${[0, 25, 50, 75, 100].map((v) => `<span style="left:${(v + 0.5) / 101 * 100}%">${v}</span>`).join("")}</div>
      </div>`;
    this.bindHandles();
    $("#s-reset") && ($("#s-reset").onclick = () => { this.lines = { strong: h.strong_at, maybe: h.maybe_at }; this.drawStrip(); });
    $("#s-save") && ($("#s-save").onclick = () => this.saveLines());
  },
  bindHandles() {
    const strip = $("#strip");
    for (const which of ["maybe", "strong"]) {
      const hEl = $(`#h-${which}`);
      const set = (v) => {
        v = Math.max(0, Math.min(100, Math.round(v)));
        if (which === "maybe") v = Math.min(v, this.lines.strong);
        else v = Math.max(v, this.lines.maybe);
        if (v !== this.lines[which]) { this.lines[which] = v; this.drawStrip(); $(`#h-${which}`).focus(); }
      };
      hEl.onpointerdown = (e) => {
        hEl.setPointerCapture(e.pointerId);
        const rect = strip.getBoundingClientRect();
        const move = (ev) => {
          const v = ((ev.clientX - rect.left) / rect.width) * 101 - 0.5;
          v2 = Math.max(0, Math.min(100, Math.round(v)));
          if (which === "maybe") v2 = Math.min(v2, this.lines.strong); else v2 = Math.max(v2, this.lines.maybe);
          if (v2 !== this.lines[which]) { this.lines[which] = v2; this.drawStripLight(); }
        };
        let v2;
        const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); this.drawStrip(); };
        addEventListener("pointermove", move); addEventListener("pointerup", up);
      };
      hEl.onkeydown = (e) => {
        const step = e.shiftKey ? 5 : 1;
        if (e.key === "ArrowLeft" || e.key === "ArrowDown") { set(this.lines[which] - step); e.preventDefault(); }
        if (e.key === "ArrowRight" || e.key === "ArrowUp") { set(this.lines[which] + step); e.preventDefault(); }
      };
    }
  },
  /* during a drag, redraw everything but keep the pointer capture alive */
  drawStripLight() {
    const strip = $("#strip"); const prev = strip.querySelector(".handle:focus");
    const hm = $("#h-maybe"), hs = $("#h-strong");
    const L = this.lines, h = this.hist, words = TIER_WORD[this.f.track];
    hm.style.left = `${(L.maybe + 0.5) / 101 * 100}%`; hm.querySelector("span").textContent = `Maybe ${L.maybe}`;
    hs.style.left = `${(L.strong + 0.5) / 101 * 100}%`; hs.querySelector("span").textContent = `${words.strong} ${L.strong}`;
    const svg = strip.querySelector("svg");
    const rects = svg.querySelectorAll("rect");
    rects[0].setAttribute("x", L.strong * 10); rects[0].setAttribute("width", 1010 - L.strong * 10);
    rects[1].setAttribute("x", L.maybe * 10); rects[1].setAttribute("width", (L.strong - L.maybe) * 10);
    rects.forEach((r, i) => {
      if (i < 2) return;
      const s = Math.round((+r.getAttribute("x") - 1) / 10);
      r.setAttribute("fill", `var(--${s >= L.strong ? "strong" : s >= L.maybe ? "maybe" : "weak"})`);
    });
    const counts = { weak: 0, maybe: 0, strong: 0 };
    h.bins.forEach((n, s) => { counts[s >= L.strong ? "strong" : s >= L.maybe ? "maybe" : "weak"] += n; });
    const z = $$(".zones b");
    z[0].textContent = counts.strong; z[1].textContent = counts.maybe; z[2].textContent = counts.weak;
    if (prev) prev.focus();
  },
  async saveLines() {
    try {
      await api("thresholds", { method: "POST", body: { track: this.f.track, strong_at: this.lines.strong, maybe_at: this.lines.maybe } });
      toast(`Saved to config.yaml: maybe from ${this.lines.maybe}, ${TIER_WORD[this.f.track].strong.toLowerCase()} from ${this.lines.strong}`);
      await refreshSide();
      this.reload(true);
    } catch (e) { fail(e); }
  },
  key(e) {
    if (Router.page !== "postings" || e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = this.rows.findIndex((r) => r.uid === this.selected);
    const j = this.rows[i];
    if (e.key === "j" || e.key === "k") {
      const n = this.rows[Math.max(0, Math.min(this.rows.length - 1, i + (e.key === "j" ? 1 : -1)))];
      if (n) this.open(n.uid, true);
    } else if (e.key === "o" && j?.url) window.open(j.url, "_blank", "noopener");
    else if (e.key === "b" && j) this.toggleBookmark(j.uid);
    else if (j && { s: "saved", a: "applied", d: "dismissed", n: "new" }[e.key]) this.setStatus(j.uid, { s: "saved", a: "applied", d: "dismissed", n: "new" }[e.key]);
  },
};
document.addEventListener("keydown", (e) => Postings.key(e));
Router.pages.postings = Postings;

/* =======================================================================
   Run a scan
   ======================================================================= */
const SOURCES = [["adzuna", "Adzuna"], ["usajobs", "USAJOBS"], ["nyc", "NYC jobs"], ["greenhouse", "Greenhouse"],
  ["lever", "Lever"], ["ashby", "Ashby"], ["workday", "Workday"]];
const RunPage = {
  view: "log", current: null, runner: null,
  render(root, [runId]) {
    root.innerHTML = `<div class="page">
      <div class="page-head"><h1>Run a scan</h1><span id="r-view"></span></div>
      <div class="section-grid">
        <div class="stack">
          <form class="panel stack" id="r-form">
            <h2>Find new postings</h2>
            <p class="hint">Fetches every source, drops what you have already seen, scores the rest and emails the digest. The same as <code>python main.py</code>.</p>
            <div class="seg" id="r-track-seg"></div>
            <fieldset style="border:0;padding:0;margin:0" class="stack">
              <legend class="hint" style="margin-bottom:6px">Sources</legend>
              <div class="row" style="gap:6px 14px">${SOURCES.map(([v, l]) =>
                `<label class="check"><input type="checkbox" name="src" value="${v}" checked> ${l}</label>`).join("")}</div>
            </fieldset>
            <label class="field">Only these places (optional)<input type="text" name="location" placeholder="new york, newark"></label>
            <label class="field">Most postings to send to a paid model<input type="number" name="max_score" min="1" placeholder="From config"></label>
            <label class="check"><input type="checkbox" name="dry_run"> Dry run: score and show the digest, but record and send nothing</label>
            <label class="check"><input type="checkbox" name="no_score"> Skip scoring (keyword estimates only, free)</label>
            <div><button class="btn primary" type="submit">Start the scan</button></div>
          </form>
          <div class="panel"><h2>Recent tasks</h2><div id="r-list" class="stack" style="gap:2px;margin-top:8px"></div></div>
        </div>
        <div id="r-right"></div>
      </div>
    </div>`;
    let track = "";
    $("#r-track-seg").replaceWith(seg([["", "Both tracks"], ["career", "Career only"], ["bridge", "Bridge only"]], "",
      (v) => { track = v; }, "Track"));
    $("#r-form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const opts = { track, sources: fd.getAll("src"), location: fd.get("location").trim(),
        max_score: fd.get("max_score"), dry_run: fd.get("dry_run") === "on", no_score: fd.get("no_score") === "on" };
      if (!opts.sources.length) return toast("Pick at least one source", { bad: true });
      try { const r = await Tasks.start("scan", opts, { quietToast: true, onDone: () => refreshSide() }); go(`#/run/${r.id}`); }
      catch (err) { fail(err); }
    };
    $("#r-view").appendChild(seg([["log", "Task output"], ["digest", "Digest preview"]], this.view, (v) => { this.view = v; this.drawRight(); }, "View"));
    this.current = runId || null;
    this.drawRight();
    api("runs").then((runs) => {
      this.refreshList(runs);
      if (!this.current && runs[0] && this.view === "log") { this.current = runs[0].id; this.runner?.attach(this.current); }
    });
  },
  drawRight() {
    const right = $("#r-right");
    if (this.view === "digest") return this.drawDigest(right);
    right.innerHTML = `<div id="r-log"></div>`;
    this.runner = inlineRunner($("#r-log"), { onDone: () => refreshSide() });
    if (this.current) this.runner.attach(this.current);
  },
  async drawDigest(right) {
    right.innerHTML = `<div class="log-head"><span class="muted" id="dg-note">Loading</span><select id="dg-when" aria-label="Which postings">
      <option value="">The last scan</option><option value="1">The last day</option><option value="7">The last week</option></select></div>
      <iframe class="digest" id="dg" title="Digest preview" sandbox=""></iframe>`;
    const load = async () => {
      try {
        const d = await api("digest?" + qs({ days: $("#dg-when").value }));
        $("#dg-note").textContent = d.count ? `The email as it would be built from ${d.count} postings, with today's thresholds` : "No postings in that window yet.";
        $("#dg").srcdoc = d.html || "<p style='font-family:sans-serif;color:#666'>Nothing to show.</p>";
      } catch (e) { fail(e); }
    };
    $("#dg-when").onchange = load; load();
  },
  refreshList(runs) {
    const el = $("#r-list"); if (!el) return;
    el.innerHTML = runs.length ? runs.map((r) => `<a href="#/run/${r.id}" class="draftrow" ${r.id === this.current ? 'aria-selected="true"' : ""} style="padding:7px 10px">
      <span class="ti" style="display:flex;gap:8px;align-items:center">${r.running ? '<span class="spin"></span>' : ""}${esc(r.label)}</span>
      <span class="co">${new Date(r.started * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}${r.running ? ", running" : r.code === 0 ? ", finished" : `, failed (${r.code})`}</span></a>`).join("")
      : `<p class="hint">Nothing has run since the server started.</p>`;
    $$("a", el).forEach((a) => a.style.textDecoration = "none");
  },
};
Router.pages.run = RunPage;

/* =======================================================================
   Drafts
   ======================================================================= */
const REC_WORD = { apply: "Apply", manual_review: "Needs your call", do_not_apply: "Do not apply" };
const Drafts = {
  list: [], sel: null, tab: "analysis",
  async render(root, [stem, tab]) {
    if (stem) this.sel = stem;
    if (tab) this.tab = tab;
    root.innerHTML = `<div class="page">
      <div class="page-head"><h1>Drafts</h1>
        <button class="btn" id="dr-paste">Draft from a pasted posting</button>
        <button class="btn" id="dr-batch">Draft in bulk</button></div>
      <div id="dr-panel"></div>
      <div class="filters" id="dr-filters" role="group" aria-label="Filter drafts"></div>
      <div class="drafts" id="dr-split">
        <section class="list" aria-label="Drafts"><div class="list-head"><span id="dr-count"></span></div><div id="dr-rows"></div></section>
        <section class="detail" id="dr-detail"><div class="empty">Choose a job to see its analysis and drafts.</div></section>
      </div></div>`;
    $("#dr-paste").onclick = () => this.pastePanel();
    $("#dr-batch").onclick = () => this.batchPanel();
    await this.load();
  },
  f: { hideSkipped: false, hideReviewed: false, hideDrafted: false },
  visible() {
    return this.list.filter((d) => {
      if (this.f.hideDrafted && d.drafted) return false;
      if (this.f.hideSkipped && d.rec === "do_not_apply") return false;
      if (this.f.hideReviewed && !d.drafted && d.rec !== "do_not_apply") return false;
      return true;
    });
  },
  drawFilters() {
    const el = $("#dr-filters"); if (!el) return;
    const n = { drafted: 0, skipped: 0, reviewed: 0 };
    for (const d of this.list) {
      if (d.drafted) n.drafted++;
      else if (d.rec === "do_not_apply") n.skipped++;
      else n.reviewed++;
    }
    const boxes = [["hideDrafted", "drafted", "Hide drafted"],
                   ["hideSkipped", "skipped", "Hide not worth it"],
                   ["hideReviewed", "reviewed", "Hide reviewed, not drafted"]];
    el.innerHTML = boxes.map(([f, k, label]) =>
      `<label class="check"><input type="checkbox" data-df="${f}" ${this.f[f] ? "checked" : ""}>

/* =======================================================================
   Assistant — answers questions about the tool, and reviews a draft.

   It is a panel rather than a page because it is always asked about
   something already on screen: this draft, this posting. Opening it from a
   nav item would mean re-selecting what you were just looking at.
   ======================================================================= */
const Assist = {
  busy: false,
  mount() {
    if ($("#assist-wrap")) return;
    const d = document.createElement("div");
    d.id = "assist-wrap";
    d.innerHTML = `<div class="assist-card panel stack" role="dialog" aria-label="Assistant" aria-modal="false">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">Assistant</h2>
        <button class="btn quiet" id="as-close" aria-label="Close">Close</button></div>
      <p class="hint" id="as-ctx"></p>
      <label class="field"><span class="sr-only">Your question</span>
        <textarea id="as-q" rows="3" placeholder="Ask about the tool, or ask for a review of this draft."></textarea></label>
      <div class="row"><button class="btn primary" id="as-go">Ask</button>
        <span class="hint" id="as-model"></span></div>
      <div id="as-out"></div></div>`;
    document.body.appendChild(d);
    $("#as-close").onclick = () => this.close();
    $("#as-go").onclick = () => this.send();
    $("#as-q").addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") this.send();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $("#assist-wrap")?.classList.contains("open")) this.close();
    });
  },
  open({ path = null, uid = null, question = "" } = {}) {
    this.mount();
    this.ctx = { path, uid };
    $("#as-ctx").textContent = path ? `Reviewing ${path}` : (uid ? "About the selected posting" : "About jobscan");
    $("#as-q").value = question;
    $("#assist-wrap").classList.add("open");
    document.body.classList.add("assist-open");
    $("#as-q").focus();
    if (question) this.send();
  },
  close() {
    $("#assist-wrap")?.classList.remove("open");
    document.body.classList.remove("assist-open");
  },
  async send() {
    if (this.busy) return;
    const q = $("#as-q").value.trim();
    if (!q) { toast("Type a question first", { bad: true }); return; }
    this.busy = true;
    $("#as-go").disabled = true;
    $("#as-out").innerHTML = `<p class="muted">Thinking...</p>`;
    try {
      const r = await api("assist", { method: "POST", body: { question: q, ...this.ctx } });
      $("#as-out").innerHTML = `<div class="assist-answer">${mdLite(r.answer || "")}</div>`;
      $("#as-model").textContent = r.model || "";
    } catch (e) {
      $("#as-out").innerHTML = `<p class="problem">${esc(e.message)}</p>`;
    } finally { this.busy = false; $("#as-go").disabled = false; }
  },
};

/* Just enough Markdown for an answer: headings, bullets, bold, code. */
function mdLite(s) {
  const lines = esc(s).split("\n");
  let out = "", list = false;
  for (const raw of lines) {
    const t = raw.trim();
    const bullet = /^[-*]\s+/.test(t);
    if (bullet && !list) { out += "<ul>"; list = true; }
    if (!bullet && list) { out += "</ul>"; list = false; }
    if (!t) { continue; }
    const inline = (x) => x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
    if (bullet) out += `<li>${inline(t.replace(/^[-*]\s+/, ""))}</li>`;
    else if (/^#{1,6}\s/.test(t)) out += `<h3>${inline(t.replace(/^#{1,6}\s+/, ""))}</h3>`;
    else out += `<p>${inline(t)}</p>`;
  }
  if (list) out += "</ul>";
  return out;
}
